name: Perf Guard

# TASK-18908: born of the 2026-08 Windows 3 s-lag incident. The lag shipped
# through 100+ green PRs because nothing measured UI latency. This workflow
# runs the latency guardrails (screen-switch budgets + Textual CSS parse-
# cache cliff) and nothing else, so it stays a usable merge signal even
# while the big Tests workflow is red on all branches (TASK-18608).
#
# Standalone by design, like css-bundle-guard/backlog-guard: a PR that
# makes a destination slower than the incident class, or that crosses the
# LRU-64 stylesheet cliff, fails HERE first -- in minutes, not at the next
# user report.

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tldw_chatbook/**.py'
      - 'tldw_chatbook/css/**'
      - 'Tests/Performance/**'
      # The stall-persistence tests run in this workflow too, and the job
      # installs from pyproject.toml -- a dependency bump (e.g. the pinned
      # Textual version) or a change to those tests must not merge without
      # this guard's verdict (Qodo finding on PR #1827).
      - 'Tests/Utils/test_ui_responsiveness_stall_persist.py'
      - 'pyproject.toml'
      - '.github/workflows/perf-guard.yml'
  push:
    branches: [dev, main]
    paths:
      - 'tldw_chatbook/**.py'
      - 'tldw_chatbook/css/**'
      - 'Tests/Performance/**'
      # The stall-persistence tests run in this workflow too, and the job
      # installs from pyproject.toml -- a dependency bump (e.g. the pinned
      # Textual version) or a change to those tests must not merge without
      # this guard's verdict (Qodo finding on PR #1827).
      - 'Tests/Utils/test_ui_responsiveness_stall_persist.py'
      - 'pyproject.toml'
      - '.github/workflows/perf-guard.yml'

# One run per workflow per ref (same rationale as css-bundle-guard: obsolete
# runs must not queue up competing for scarce runners).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

jobs:
  ui-latency-guardrails:
    name: UI latency guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package (test deps only path)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run latency guardrails
        run: |
          pytest Tests/Performance/test_ui_latency_guardrails.py \
            Tests/Utils/test_ui_responsiveness_stall_persist.py \
            -v --timeout=300

      # task-24461: the ADR-097 boot budgets ran ONLY in the slow full suite,
      # so for three review cycles running they were re-breached within ~24h of
      # every paydown and each breach was found by a periodic review rather
      # than by the PR that caused it. They are cheap (~15s together) and they
      # already print the culprit modules, so the breaching PR now gets that
      # list here, in minutes.
      #
      # test_boot_css_byte_budget.py is deliberately NOT in this list yet: it
      # is red on dev (862,184 B against an 860,000 B ratchet) and adding it
      # would block every unrelated PR. It joins this step when task-24459
      # lands.
      - name: Run boot budget ratchets
        run: |
          pytest Tests/Performance/test_app_import_weight.py \
            Tests/Performance/test_ui_ready_module_census.py \
            Tests/Performance/test_boot_worker_census.py \
            Tests/Performance/test_textual_css_fastpath.py \
            -v --timeout=300
