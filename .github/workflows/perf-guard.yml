name: Perf Guard
run-name: Light CI containment diagnostic (not qualification)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: light-ci-containment-diagnostic-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTEST_TIMEOUT: 300
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1
jobs:
  containment-diagnostic:
    name: Two-node Linux containment diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the comprehensive core dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest-json-report
          pip install -e ".[embeddings_rag,websearch,chunker,web]"
          pip install pydub "audioop-lts; python_version >= '3.13'"
      - name: Run the two original failing child selectors
        run: |
          python -m pytest \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_settles_one_real_catalogue_selector \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_real_hermetic_child_runs_declared_async_curated_selector \
            --basetemp="$RUNNER_TEMP/light-ci-containment-tests" -v --tb=short
      - name: Report only bounded containment metadata
        if: always()
        env:
          DIAGNOSTIC_ROOT: ${{ runner.temp }}/light-ci-containment-tests
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ['DIAGNOSTIC_ROOT'])
          for path in sorted(root.rglob('child-stderr.log')):
              for line in path.read_text(errors='replace').splitlines():
                  if line.startswith('LIGHT_CI_CONTAINMENT_META '):
                      print(line)
          for path in sorted(root.rglob('attempts.jsonl')):
              print('LIGHT_CI_CONTAINMENT_CATEGORY', path.read_text()[:1000].strip())
          PY
