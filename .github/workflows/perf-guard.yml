name: Perf Guard
run-name: Managed received Linux diagnostic (not qualification)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: light-ci-managed-received-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  managed-received-diagnostic:
    name: Linux original managed received diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # Exact install from failed recovered job135117257904; no optional groups.
      - name: Install recovered-lane dependencies
        run: python -m pip install -e . pytest pytest-asyncio pytest-timeout packaging aiohttp-jinja2
      - name: Record source and dependency identity without application imports
        run: |
          git diff --quiet 2f0065b770d5e2d97224c47c0fb75979fa7bca76 -- tldw_chatbook packages
          python - <<'PY'
          import hashlib
          import importlib.metadata as metadata
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys

          names = ('pytest', 'pytest-asyncio', 'pytest-timeout', 'platformdirs',
                   'anyio', 'textual', 'pydantic', 'cryptography', 'keyring',
                   'psutil', 'portalocker', 'packaging', 'aiohttp-jinja2')
          versions = {}
          for name in names:
              try:
                  versions[name] = metadata.version(name)
              except metadata.PackageNotFoundError:
                  versions[name] = None
          source = 'Tests/Performance/test_console_managed_received_acceptance.py'
          print('MANAGED_RECEIVED_IDENTITY', json.dumps({
              'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'product_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD:tldw_chatbook'], text=True).strip(),
              'packages_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD:packages'], text=True).strip(),
              'test_sha256': hashlib.sha256(Path(source).read_bytes()).hexdigest(),
              'python': platform.python_version(), 'platform': sys.platform,
              'image_os': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'),
              'versions': versions,
              'pytest_entry_points': sorted((entry.name, entry.value)
                                            for entry in metadata.entry_points(group='pytest11')),
          }, sort_keys=True))
          PY
      - name: Run only the original managed received node
        run: |
          mkdir -p "$RUNNER_TEMP/managed-received-diagnostic"
          pytest \
            Tests/Performance/test_console_managed_received_acceptance.py::test_received_managed_demand_uses_one_catalog_and_real_cold_initializer \
            --storage-lease-guard --timeout=180 --tb=short \
            --basetemp="$RUNNER_TEMP/managed-received-diagnostic/pytest" \
            --junitxml="$RUNNER_TEMP/managed-received-diagnostic/pytest.xml" \
            > "$RUNNER_TEMP/managed-received-diagnostic/pytest-output.log" 2>&1
      - name: Report only filtered lifecycle and outcome facts
        if: always()
        env:
          DIAGNOSTIC_ROOT: ${{ runner.temp }}/managed-received-diagnostic
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path(os.environ['DIAGNOSTIC_ROOT']).resolve()
          paths = sorted({path.resolve() for path in root.rglob('managed-received-facts.json')
                          if path.resolve().is_relative_to(root)})
          print('MANAGED_RECEIVED_FACT_COUNT', len(paths))
          keys = ('order', 'visible', 'builder_count', 'denied', 'overflow',
                  'primary_failure_type', 'failed_bound', 'failure_binding',
                  'failure_binding_error', 'observer_errors', 'observer_failure_sites',
                  'drain', 'provider_calls', 'network_attempts', 'profile_violations')
          source_keys = ('complete', 'original_source_current',
                         'hooks_retired_before_inactive', 'global_events',
                         'replacements_installed', 'frames_arguments_results_tasks_retained')
          for path in paths[:2]:
              facts = json.loads(path.read_text())
              selected = {key: facts[key] for key in keys if key in facts}
              source = facts.get('source_receipt', {})
              selected['source_receipt'] = {key: source.get(key) for key in source_keys}
              selected['source_invalid_count'] = len(source.get('invalid', []))
              selected['source_unresolved_count'] = len(source.get('unresolved_spans', []))
              print('MANAGED_RECEIVED_FACTS', json.dumps(selected, sort_keys=True))
          junit = root / 'pytest.xml'
          summary = {'present': junit.is_file()}
          if junit.is_file():
              tree = ET.parse(junit)
              summary.update({name: len(tree.findall('.//' + tag))
                              for name, tag in (('tests', 'testcase'), ('failures', 'failure'),
                                                ('errors', 'error'), ('skips', 'skipped'))})
          print('MANAGED_RECEIVED_JUNIT', json.dumps(summary, sort_keys=True))
          PY
