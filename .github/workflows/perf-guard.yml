name: Perf Guard
run-name: Light CI vendored discovery repair probe (not qualification)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: light-ci-containment-diagnostic-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTEST_TIMEOUT: 300
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1
jobs:
  containment-diagnostic:
    name: Linux vendored discovery and containment controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the comprehensive core dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest-json-report
          pip install -e ".[embeddings_rag,websearch,chunker,web]"
          pip install pydub "audioop-lts; python_version >= '3.13'"
      - name: Run original selectors and containment controls
        run: |
          python -m pytest \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_discovers_only_checkout_owned_vendored_core \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_settles_one_real_catalogue_selector \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_real_hermetic_child_runs_declared_async_curated_selector \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_real_hermetic_child_still_runs_declared_synchronous_selector \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_psutil_capability_probes_are_linux_stat_only \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_imports_psutil_after_containment_without_reading_probe_contents \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_psutil_stat_probes_grant_no_other_access \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_runtime_authority_allows_only_linux_own_process_collector_files \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_imports_prometheus_after_containment_with_real_process_metrics \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_process_collector_files_grant_no_other_access \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_own_mountinfo_has_no_related_or_write_authority \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_fdinfo_requires_current_tracked_scratch_directory \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_reads_linux_mount_metadata_for_tracked_scratch_directory \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_linux_mount_metadata_grants_no_other_access \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_immediately_exits_for_each_prohibited_network_api \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_immediately_exits_for_each_prohibited_process_api \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_records_and_blocks_read_from_real_profile \
            Tests/Live/test_library_adaptive_reader_closeout.py::test_child_records_and_blocks_write_to_checkout \
            --basetemp="$RUNNER_TEMP/light-ci-containment-tests" -v --tb=short
      - name: Report only bounded containment metadata
        if: always()
        env:
          DIAGNOSTIC_ROOT: ${{ runner.temp }}/light-ci-containment-tests
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ['DIAGNOSTIC_ROOT'])
          for path in sorted(root.rglob('child-stderr.log')):
              for line in path.read_text(errors='replace').splitlines():
                  if line.startswith('LIGHT_CI_CONTAINMENT_META '):
                      print(line)
          for path in sorted(root.rglob('attempts.jsonl')):
              print('LIGHT_CI_CONTAINMENT_CATEGORY', path.read_text()[:1000].strip())
          PY
