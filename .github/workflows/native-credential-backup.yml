name: Native credential backup qualification

on:
  workflow_dispatch:

permissions:
  contents: read

# A source captures once; each destination restores all three source archives.
jobs:
  source:
    name: Source credentials on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy: &native-matrix
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    env:
      NATIVE_PRODUCT_SELECTION: native-credentials-source
      TLDW_CREDENTIAL_TRANSFER_ROOT: &transfer-root ${{ runner.temp }}/native-credential-transfer
      NATIVE_EVIDENCE_ROOT: &evidence-root ${{ runner.temp }}/native-credential-qualification
    steps:
      - &checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - &python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - &dependencies
        name: Install core application and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip 'setuptools>=77' wheel
          python -m pip install -e . pytest pytest-asyncio pytest-timeout build
      - &linux-services
        name: Install native Linux credential services
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dbus gnome-keyring
      - &qualify
        name: Qualify installed application against disposable native credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$TLDW_CREDENTIAL_TRANSFER_ROOT" "$NATIVE_EVIDENCE_ROOT"
          case "$RUNNER_OS" in
            macOS)
              export PYTHON_KEYRING_BACKEND=keyring.backends.macOS.Keyring
              ;;
            Windows)
              export PYTHON_KEYRING_BACKEND=keyring.backends.Windows.WinVaultKeyring
              ;;
            Linux)
              export PYTHON_KEYRING_BACKEND=keyring.backends.SecretService.Keyring
              export KEYRING_PROPERTY_PREFERRED_COLLECTION=/org/freedesktop/secrets/collection/login
              SESSION_ROOT="$RUNNER_TEMP/native-credential-session"
              mkdir -m 700 "$SESSION_ROOT"
              export TLDW_NATIVE_CREDENTIAL_ROOT="$(cd "$SESSION_ROOT" && pwd -P)"
              export XDG_DATA_HOME="$TLDW_NATIVE_CREDENTIAL_ROOT/xdg-data"
              export XDG_CONFIG_HOME="$TLDW_NATIVE_CREDENTIAL_ROOT/xdg-config"
              export XDG_RUNTIME_DIR="$TLDW_NATIVE_CREDENTIAL_ROOT/runtime"
              mkdir -m 700 "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR"
              # Force a private endpoint instead of inheriting the login session bus.
              cat > "$TLDW_NATIVE_CREDENTIAL_ROOT/dbus-daemon" <<'SH'
          #!/bin/sh
          exec /usr/bin/dbus-daemon --address="unix:path=$TLDW_NATIVE_CREDENTIAL_ROOT/bus" "$@"
          SH
              chmod 700 "$TLDW_NATIVE_CREDENTIAL_ROOT/dbus-daemon"
              dbus-run-session --dbus-daemon="$TLDW_NATIVE_CREDENTIAL_ROOT/dbus-daemon" -- bash -euo pipefail -c '
                unset GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
                python -c "import secrets,sys; sys.stdout.write(secrets.token_urlsafe(32))" |
                  gnome-keyring-daemon --foreground --unlock --components=secrets \
                    --control-directory="$TLDW_NATIVE_CREDENTIAL_ROOT/control" \
                    > "$TLDW_NATIVE_CREDENTIAL_ROOT/daemon.log" 2>&1 &
                daemon_job=$!
                trap "kill $daemon_job 2>/dev/null || true" EXIT
                for attempt in $(seq 1 20); do
                  if python -c "from Tests.Backup_Recovery.run_platform_product import validate_native_credential_environment; validate_native_credential_environment()" \
                    > "$TLDW_NATIVE_CREDENTIAL_ROOT/preflight.log" 2>&1; then
                    break
                  fi
                  sleep 1
                done
                python Tests/Backup_Recovery/run_platform_product.py \
                  --evidence-root "$NATIVE_EVIDENCE_ROOT" \
                  --product-selection "$NATIVE_PRODUCT_SELECTION"
              '
              exit $?
              ;;
            *) exit 1 ;;
          esac
          python Tests/Backup_Recovery/run_platform_product.py \
            --evidence-root "$NATIVE_EVIDENCE_ROOT" \
            --product-selection "$NATIVE_PRODUCT_SELECTION"
      - name: Retain encrypted source and public receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/native-credential-qualification/artifacts/source-*.age
            ${{ runner.temp }}/native-credential-qualification/artifacts/source-*.json
            ${{ runner.temp }}/native-credential-qualification/artifacts/summary.json
            ${{ runner.temp }}/native-credential-qualification/artifacts/artifact-sha256.json
          if-no-files-found: error
          retention-days: 7

  destination:
    name: Restore all source credentials on ${{ matrix.os }}
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy: *native-matrix
    env:
      NATIVE_PRODUCT_SELECTION: native-credentials-destination
      TLDW_CREDENTIAL_TRANSFER_ROOT: *transfer-root
      NATIVE_EVIDENCE_ROOT: *evidence-root
    steps:
      - *checkout
      - *python
      - *dependencies
      - *linux-services
      - name: Download all three source transfers
        uses: actions/download-artifact@v4
        with:
          pattern: source-*
          path: ${{ runner.temp }}/native-credential-transfer
          merge-multiple: false
      - *qualify
      - name: Retain direction checks and public receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: destination-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/native-credential-qualification/artifacts/destination-results.json
            ${{ runner.temp }}/native-credential-qualification/artifacts/summary.json
            ${{ runner.temp }}/native-credential-qualification/artifacts/artifact-sha256.json
          if-no-files-found: error
          retention-days: 7
