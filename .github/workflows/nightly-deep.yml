name: Nightly Deep

# Scheduled workflows are registered only from the default branch (`main`).
# This file is kept identical on `dev` and `main`; its checkout pins the test
# target to `dev` without promoting unrelated development changes.
on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTEST_TIMEOUT: 300
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1
  FORCE_COLOR: 1

defaults:
  run:
    shell: bash

jobs:
  resolve-dev-sha:
    name: Resolve nightly dev commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Resolve one dev commit for every matrix leg
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  nightly-deep:
    # task-1465: serial execution (order-regression canary), thorough
    # Hypothesis, --run-slow, CSS parse cache off, coverage, and the OS/Python
    # breadth intentionally excluded from the fast PR lane.
    name: Nightly Deep - Python ${{ matrix.python-version }} - ${{ matrix.os }}
    needs: [resolve-dev-sha]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            io-encoding: utf-8
          - os: ubuntu-latest
            python-version: "3.13"
            io-encoding: utf-8
          - os: macos-latest
            python-version: "3.12"
            io-encoding: utf-8
          - os: windows-latest
            python-version: "3.12"
            # TASK-25706: exercise the common legacy Windows console posture,
            # not only the UTF-8 environment supplied by hosted runners.
            io-encoding: cp1252

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-dev-sha.outputs.sha }}
          fetch-depth: 0

      - name: Record tested dev commit
        run: echo "Tested dev commit ${{ needs.resolve-dev-sha.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest-json-report pytest-cov
          pip install -e ".[embeddings_rag,websearch,chunker]"
          # pydub (+ its 3.13 audioop shim) only: briefings audio tests need
          # these two, not the entire heavyweight `audio` extra.
          pip install pydub "audioop-lts; python_version >= '3.13'"

      - name: Setup test environment
        run: |
          python -c "import nltk; nltk.download('punkt', quiet=True)"
          python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

      # TASK-32908: --continue-on-collection-errors is not defensive padding,
      # it is a repair. Without it ONE unimportable test file aborts the whole
      # session, and this job had been doing exactly that every night:
      # run 35706024071 (2026-09-22) logged `collected 101851 items / 1 error`
      # followed by `Interrupted: 1 error during collection` -- 8 skipped,
      # ZERO tests executed -- and the same on the six preceding nights. The
      # culprit was Tests/Chat/test_google_native_tools.py importing
      # `_google_tools_payload`, which 0ea2906e99 deleted from
      # LLM_API_Calls.py while leaving its call site at line 3435 (a live
      # NameError on the Google native-tools path, still unfixed).
      #
      # A whole-tree nightly is the only coverage the ~96% of Tests/UI outside
      # the PR gate has. One bad import must cost that one file, not all
      # 101,851 tests. The run still reports the collection error and still
      # exits non-zero -- nothing is being swallowed.
      #
      # LIMIT, stated rather than implied: this repairs the collection abort,
      # it does NOT make the nightly green. The job ceiling is 240 minutes and
      # this run is deliberately serial (see the step name). Tests/UI alone
      # measured ~18,148 tests in >2h across SIX processes, so a serial
      # whole-tree pass cannot finish inside the ceiling and will be killed
      # with partial results. That is strictly more signal than the zero tests
      # it produced before, and still a failing one. Sharding or scoping the
      # nightly is a design decision, tracked separately.
      - name: Run deep suite (serial, thorough, slow tiers, cache-off)
        env:
          TLDW_HYPOTHESIS_PROFILE: thorough
          TLDW_TEST_CSS_CACHE: "0"
          PYTHONIOENCODING: ${{ matrix.io-encoding }}
        run: |
          pytest ./Tests/ \
            --run-slow \
            --continue-on-collection-errors \
            --timeout=600 \
            --json-report --json-report-omit log \
            --json-report-file=nightly-test-results-${{ matrix.os }}-${{ matrix.python-version }}.json \
            --cov=tldw_chatbook \
            --cov-report=xml:coverage-nightly-${{ matrix.os }}-${{ matrix.python-version }}.xml

      - name: Upload nightly results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            nightly-test-results-*.json
            coverage-nightly-*.xml
