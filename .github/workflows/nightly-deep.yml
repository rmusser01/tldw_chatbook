name: Submitted Log Windows Validation

# Temporary validation only. Pin the checkout to the exact dispatched branch
# commit so workflow_dispatch cannot silently test dev instead of this probe.
on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

concurrency:
  group: submitted-log-windows-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTEST_TIMEOUT: 300
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1
  FORCE_COLOR: 1

defaults:
  run:
    shell: bash

jobs:
  nightly-deep:
    name: Submitted Log Validation - Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record tested probe commit
        run: echo "Tested probe commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest-json-report pytest-cov
          pip install -e ".[embeddings_rag,websearch,chunker]"
          # pydub (+ its 3.13 audioop shim) only: briefings audio tests need
          # these two, not the entire heavyweight `audio` extra.
          pip install pydub "audioop-lts; python_version >= '3.13'"

      - name: Setup test environment
        run: |
          python -c "import nltk; nltk.download('punkt', quiet=True)"
          python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

      - name: Run compact selection-menu probe in isolation
        continue-on-error: true
        env:
          TLDW_TEST_CSS_CACHE: "0"
          PYTHONIOENCODING: cp1252
        run: |
          pytest \
            Tests/UI/test_console_selection_menu.py::test_short_owner_box_shrinks_menu_and_keeps_containment \
            --timeout=300 \
            --json-report --json-report-omit log \
            --json-report-file=submitted-log-menu-probe-${{ matrix.os }}-${{ matrix.python-version }}.json

      - name: Run submitted-log regression matrix under strict CP1252 output
        env:
          TLDW_TEST_CSS_CACHE: "0"
          PYTHONIOENCODING: cp1252
        run: |
          pytest \
            Tests/UI/test_css_staleness_manifest.py \
            Tests/UI/test_console_selection_menu.py \
            Tests/UI/test_console_selection_transcript.py \
            Tests/App/test_startup_init_hygiene.py \
            Tests/DB/test_private_sqlite.py \
            Tests/Evals/test_eval_runner.py \
            Tests/Evals/test_task_loader.py \
            Tests/LLM_Provider_Catalog/test_model_discovery_disk_cache.py \
            Tests/Metrics/test_startup_metric_outcomes.py \
            Tests/RuntimePolicy/test_runtime_policy_private_store.py \
            Tests/LLM_Calls/test_summarization_diagnostic_privacy.py \
            --timeout=300 \
            --json-report --json-report-omit log \
            --json-report-file=submitted-log-validation-${{ matrix.os }}-${{ matrix.python-version }}.json

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submitted-log-validation-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            submitted-log-validation-*.json
