name: Merge Queue

# One-at-a-time merge queue for dev.
# Spec: Docs/superpowers/specs/2026-10-03-merge-queue-design.md
#
# Wakes on a PR being armed, disarmed or closed, and on pushes to dev. derived-artifacts.yml's
# queue-tick job runs the same script after CI. It uses no schedule, workflow_run or
# pull_request_target trigger, because those read main's copy and nothing here may depend on main. No concurrency
# group: racing runs are made safe in scripts/merge_queue.py (pinned-head rebase, idempotent
# evictions).
#
# Kill switch: repository variable MERGE_QUEUE. Unset/off = nothing; dry = decisions logged
# to the job summary only; on = act.
on:
  pull_request:
    types: [auto_merge_enabled, auto_merge_disabled, closed, synchronize]
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  # Outside Derived Artifacts' concurrency group: an obsolete run must not
  # hold its own cleanup (and the replacement head) behind its test matrix.
  cancel-superseded:
    name: Cancel superseded PR CI
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      # No checkout or PR-controlled shell interpolation. Test the actual
      # script with a recording API in Tests/CI/test_cancel_superseded_ci.py.
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const repository = `${owner}/${repo}`;
            const expected = context.payload.pull_request;
            if (!Number.isSafeInteger(expected.number) || expected.number <= 0 ||
                typeof expected.head?.ref !== 'string' || !expected.head.ref) return;
            const readPr = async () => (await github.rest.pulls.get({
              owner, repo, pull_number: expected.number
            })).data;
            const current = pr =>
              pr.number === expected.number && pr.state === 'open' &&
              pr.user?.type === 'User' && pr.base?.ref === 'dev' &&
              pr.base?.repo?.full_name === repository &&
              pr.head?.repo?.full_name === repository &&
              pr.head?.ref === expected.head.ref &&
              /^[0-9a-f]{40}$/.test(pr.head?.sha ?? '') &&
              pr.head.sha === expected.head.sha;
            if (!current(await readPr())) return;

            const active = new Set(['queued', 'pending', 'in_progress', 'waiting', 'requested']);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'derived-artifacts.yml',
              branch: expected.head.ref, event: 'pull_request', per_page: 100
            });
            for (const run of runs) {
              if (!Number.isSafeInteger(run.id) || run.id <= 0 ||
                  run.path !== '.github/workflows/derived-artifacts.yml' ||
                  run.event !== 'pull_request' || !active.has(run.status) ||
                  run.head_branch !== expected.head.ref ||
                  run.head_repository?.full_name !== repository ||
                  run.pull_requests?.length !== 1 ||
                  run.pull_requests[0].number !== expected.number ||
                  !/^[0-9a-f]{40}$/.test(run.head_sha ?? '') ||
                  run.head_sha === expected.head.sha) continue;

              // The old run's queue-tick may be the controller approving
              // this new head. Preserve the verdict/control phase, including
              // queued jobs, rather than interrupt its rebase/approval loop.
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, filter: 'latest', per_page: 100
              });
              if (jobs.some(job => job.name === 'Derived artifacts reproduce from their sources' ||
                                   job.name === 'Merge queue tick')) continue;

              // A later push, force-push back to an earlier SHA, base change,
              // or close must stop this event from cancelling fresh evidence.
              if (!current(await readPr())) return;
              try {
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                core.info(`Cancelled obsolete Derived Artifacts run ${run.id} (${run.head_sha}).`);
              } catch (error) {
                if (error.status !== 409) throw error;
                core.info(`Run ${run.id} no longer accepts cancellation.`);
              }
            }

  queue:
    name: Merge queue
    if: >-
      (vars.MERGE_QUEUE == 'dry' || vars.MERGE_QUEUE == 'on') &&
      (github.event_name == 'push' ||
       (github.event.action != 'synchronize' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
      - name: Advance the queue
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_QUEUE: ${{ vars.MERGE_QUEUE }}
        run: python3 scripts/merge_queue.py
