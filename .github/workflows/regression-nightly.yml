name: Nightly regression dispatcher
# Install this file on default-branch main before enabling CI_TIERED_ENABLED.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: nightly-regression-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch changed dev revision
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = (await github.rest.git.getRef({owner, repo, ref: 'heads/dev'})).data.object.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'derived-artifacts.yml', branch: 'dev',
              event: 'workflow_dispatch', head_sha: sha, per_page: 100
            });
            const sameNightly = runs.filter(run => run.head_sha === sha && run.display_title === 'Nightly regression');
            if (sameNightly.some(run => run.conclusion === 'success' || run.status !== 'completed')) {
              core.info(`Dev ${sha} already qualified or has an active nightly.`);
              return;
            }
            // Dispatch snapshots dev atomically; a concurrent push may select a
            // newer SHA, but all regression jobs use that run's immutable SHA.
            await github.rest.actions.createWorkflowDispatch({owner, repo,
              workflow_id: 'derived-artifacts.yml', ref: 'dev', inputs: {nightly: 'true'}});
            core.info(`Requested regression for dev (observed ${sha}); follow the Nightly regression run for its verdict.`);
