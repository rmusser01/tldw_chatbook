name: Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:
  schedule:
    # Nightly deep run (08:30 UTC); the job checks out dev explicitly because
    # scheduled workflows execute from the default branch.
    - cron: '30 8 * * *'

# One run per workflow per ref: a new push supersedes the previous run instead of
# queueing another alongside it. Without this, every push to `dev` stacked a full
# run - 50+ obsolete runs accumulated, all competing for scarce macOS runners.
# The event name is part of the group so different trigger types (push,
# pull_request, schedule) never cancel each other, and `main` is never cancelled
# so its history stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  issues: write
  pull-requests: write
  
env:
  PYTEST_TIMEOUT: 300
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1
  # Force color output for better readability
  FORCE_COLOR: 1
  
defaults:
  run:
    shell: bash

jobs:
  core-tests:
    # task-1465: full coverage on every PR replaces `-m unit` (which selected
    # 27 of ~950 files while ~590 files ran in no PR-triggered job). The UI
    # shard is its own job below; OS/Python breadth lives in nightly-deep.
    name: Core Tests (all but UI) - Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install all dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        pip install pytest-json-report
        pip install -e ".[embeddings_rag,websearch,chunker]"
        # pydub (+ its 3.13 audioop shim) only: the briefings audio tests need
        # these two and nothing else from the `audio` extra, which would also drag
        # in faster-whisper/ctranslate2/onnxruntime for no benefit here.
        pip install pydub "audioop-lts; python_version >= '3.13'"

    - name: Setup test environment
      run: |
        python -c "import nltk; nltk.download('punkt', quiet=True)"
        python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

    - name: Run core tests in parallel
      run: |
        pytest Tests --ignore=Tests/UI \
          -n auto --dist loadscope --max-worker-restart=3 \
          --timeout=300 \
          --json-report \
          --json-report-file=core-test-results-${{ matrix.os }}-${{ matrix.python-version }}.json

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: core-test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          core-test-results-*.json

  artifact-lease-spike:
    name: Artifact leases - Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install lease test dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e .
        pip install -r requirements-test.txt

    - name: Prove cross-platform operation leases
      shell: bash
      run: |
        pytest Tests/Model_Artifacts/test_operation_leases.py \
          Tests/Model_Artifacts/test_operation_leases_process.py -v

  artifact-lease-shape:
    name: Artifact lease workflow shape
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install CI shape test dependencies
      run: |
        python -m pip install pytest pytest-timeout

    - name: Verify artifact lease CI wiring
      run: |
        pytest Tests/CI/test_github_actions_test_workflow.py --confcutdir=Tests/CI

  artifact-lease-gate:
    name: Artifact Lease Gate
    runs-on: ubuntu-latest
    needs: [artifact-lease-spike, artifact-lease-shape]
    if: always()

    steps:
    - name: Require successful native lease matrix and CI shape
      run: |
        if [ "${{ needs.artifact-lease-spike.result }}" != "success" ] || [ "${{ needs.artifact-lease-shape.result }}" != "success" ]; then
          echo "Artifact lease matrix result: ${{ needs.artifact-lease-spike.result }}"
          echo "Artifact lease shape result: ${{ needs.artifact-lease-shape.result }}"
          exit 1
        fi

  windows-audio-cpp:
    name: Windows audio.cpp lifecycle - Python 3.12 - ${{ matrix.architecture }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12 (${{ matrix.architecture }})
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        architecture: ${{ matrix.architecture }}
        cache: pip

    - name: Install project and test dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e .
        pip install pytest pytest-asyncio pytest-timeout

    - name: Verify Windows audio.cpp lifecycle
      shell: pwsh
      run: |
        pytest `
          Tests/TTS/test_windows_artifact_fs.py `
          Tests/TTS/test_audio_cpp_package_scanner.py `
          Tests/TTS/test_audio_cpp_guided_launch.py `
          Tests/TTS/test_profile_reference_materialization_windows.py `
          Tests/TTS/test_audio_cpp_supervisor.py `
          Tests/TTS/test_audio_cpp_recipes.py `
          Tests/TTS/test_audio_cpp_managed_config.py `
          Tests/UI/test_settings_speech_tts_panel.py::test_windows_managed_ui_gate_uses_shared_platform_capability `
          Tests/UI/test_settings_speech_tts_panel.py::test_supported_windows_offers_managed_mode_with_bounded_privacy_copy `
          Tests/UI/test_speech_playground_pane_lifecycle.py::test_ready_clone_model_mounts_and_canonicalizes_path_free_setup `
          Tests/UI/test_speech_playground_pane_lifecycle.py::test_audio_cpp_runtime_projection_reports_exact_artifact_privacy_posture `
          Tests/UI/test_speech_playground_pane_lifecycle.py::test_server_shutdown_is_distinct_from_playback_stop_and_does_not_restart `
          Tests/TTS/test_stts_audio_cpp_generation.py::test_audio_cpp_native_generation_consumes_and_closes_one_wav_response `
          Tests/TTS/test_stts_audio_cpp_generation.py::test_audio_cpp_native_generation_propagates_cancellation_and_closes `
          Tests/TTS/test_stts_audio_cpp_generation.py::test_native_local_failures_use_fixed_recovery_copy `
          --timeout=180 `
          -q

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        pip install pytest-json-report
        # Install textual dev tools for better debugging
        pip install textual-dev
    
    - name: Run UI tests in parallel
      # The full Tests/UI directory (not just ui-marked tests), sharded with
      # xdist (task-1465). ui-marked tests OUTSIDE Tests/UI are covered by
      # core-tests, which runs everything but this directory.
      run: |
        pytest Tests/UI \
          -n auto --dist loadscope --max-worker-restart=3 \
          --timeout=180 \
          --json-report \
          --json-report-file=ui-test-results.json

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-results
        path: |
          ui-test-results.json

  textual-minimum:
    name: MCP - Minimum Textual 8.2.8
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install core and test dependencies at the Textual floor
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e .
        pip install pytest pytest-asyncio pytest-timeout
        # Floor check against the declared minimum supported Textual (pinned in pyproject.toml).
        pip install "textual==8.2.8"

    - name: Verify packaging and MCP at the Textual floor
      run: |
        pytest \
          Tests/CI/test_textual_runtime_contract.py \
          Tests/UI/test_mcp_workbench.py \
          Tests/UI/test_mcp_tools_mode.py \
          --timeout=180 \
          --tb=short
  
  all-tests:
    name: Full Test Suite (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    
    - name: Install all dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        pip install pytest-json-report pytest-cov
        pip install -e ".[embeddings_rag,websearch,chunker]"
        # pydub (+ its 3.13 audioop shim) only: the briefings audio tests need
        # these two and nothing else from the `audio` extra, which would also drag
        # in faster-whisper/ctranslate2/onnxruntime for no benefit here.
        pip install pydub "audioop-lts; python_version >= '3.13'"
    
    - name: Setup test environment
      run: |
        python -c "import nltk; nltk.download('punkt', quiet=True)"
        python -c "import nltk; nltk.download('punkt_tab', quiet=True)"
    
    - name: Run all tests
      run: |
        pytest ./Tests/ \
          --json-report \
          --json-report-file=all-test-results.json \
          --cov=tldw_chatbook \
          --cov-report=xml:coverage-all.xml \
          --cov-report=html:htmlcov \
          --cov-report=term-missing \
          -v
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: all-test-results
        path: |
          all-test-results.json
          coverage-all.xml
          htmlcov/
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage-all.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
  
  nightly-deep:
    # task-1465: the deep tiers' only home — serial execution (order-regression
    # canary), thorough Hypothesis profile, the --run-slow tests (which
    # previously ran NOWHERE), CSS parse cache off (task-1459 soak), coverage,
    # and the OS/Python breadth removed from the PR gate. Scheduled workflows
    # run from the default branch, so this checks out dev explicitly.
    name: Nightly Deep - Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
    - uses: actions/checkout@v4
      with:
        ref: dev
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install all dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        pip install pytest-json-report pytest-cov
        pip install -e ".[embeddings_rag,websearch,chunker]"
        # pydub (+ its 3.13 audioop shim) only: the briefings audio tests need
        # these two and nothing else from the `audio` extra, which would also drag
        # in faster-whisper/ctranslate2/onnxruntime for no benefit here.
        pip install pydub "audioop-lts; python_version >= '3.13'"

    - name: Setup test environment
      run: |
        python -c "import nltk; nltk.download('punkt', quiet=True)"
        python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

    - name: Run deep suite (serial, thorough, slow tiers, cache-off)
      env:
        TLDW_HYPOTHESIS_PROFILE: thorough
        TLDW_TEST_CSS_CACHE: "0"
      run: |
        pytest ./Tests/ \
          --run-slow \
          --timeout=600 \
          --json-report \
          --json-report-file=nightly-test-results-${{ matrix.os }}-${{ matrix.python-version }}.json \
          --cov=tldw_chatbook \
          --cov-report=xml:coverage-nightly-${{ matrix.os }}-${{ matrix.python-version }}.xml

    - name: Upload nightly results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nightly-test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          nightly-test-results-*.json
          coverage-nightly-*.xml

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [core-tests, ui-tests, textual-minimum, artifact-lease-gate, windows-audio-cpp]
    if: always()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all test results
      uses: actions/download-artifact@v4
      with:
        pattern: '*-test-results*'
        merge-multiple: true
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Generate test summary
      run: |
        pip install pytest-json-report
        python .github/scripts/generate_test_summary.py
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('test-summary.md', 'utf8');
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
