name: CSS Bundle Guard

# TASK-395: a source .tcss edited without regenerating the bundle (or the bundle
# hand-edited directly) silently ships broken styling -- every rebuild, including
# the app's boot-time rebuild, strips the hand-edit. This guard fails any change
# whose committed stylesheets do not reproduce from their sources. Like
# backlog-guard, it is a standalone workflow so it runs even while the general CI
# suite is left in the intentionally-cancelled state.
#
# TASK-15450 widened the path filter, and the reason matters: four of the five
# generated stylesheets are now built from class-level BUNDLED_CSS /
# BUNDLED_SCREEN_CSS string literals in modules under Widgets/** and UI/**, not
# from .tcss files. A PR that edits one widget's CSS and forgets to regenerate
# touches nothing under css/**, so a css/**-only filter would never run this
# guard on exactly the drift it exists to catch. Any .py under the package is
# therefore in scope: build_css.py AST-scans the whole package for those
# literals, so any module is a potential input. Over-triggering here is cheap
# (one stdlib-only script, no install); under-triggering ships broken styling.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tldw_chatbook/css/**'
      # `**.py`, not `**/*.py`: GitHub documents the former as "all .py files"
      # at any depth, while the latter's handling of a file directly under
      # tldw_chatbook/ (app.py -- which loads these sheets) is ambiguous.
      - 'tldw_chatbook/**.py'
      - '.github/workflows/css-bundle-guard.yml'
  push:
    branches: [dev, main]
    paths:
      - 'tldw_chatbook/css/**'
      # `**.py`, not `**/*.py`: GitHub documents the former as "all .py files"
      # at any depth, while the latter's handling of a file directly under
      # tldw_chatbook/ (app.py -- which loads these sheets) is ambiguous.
      - 'tldw_chatbook/**.py'
      - '.github/workflows/css-bundle-guard.yml'

# One PUSH run per workflow per ref: a new push supersedes the previous run instead of
# queueing another alongside it. Without this, every push to `dev` stacked a full
# run - 50+ obsolete runs accumulated, all competing for the shared account pool.
# The event name is part of the group so different trigger types (push,
# pull_request, schedule) never cancel each other, and `main` is never cancelled
# so its history stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

jobs:
  css-bundle-reproducible:
    name: CSS bundle reproduces from its sources
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number != 602 || github.event.pull_request.draft == false || github.head_ref != 'dev' || github.base_ref != 'main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bundle must match its source modules
        run: |
          # check_bundle_sync rebuilds the bundle into a temp file and diffs it
          # against the committed one, ignoring only the `Generated:` timestamp;
          # it names any drifted MODULE block. Stdlib-only, no install needed.
          python tldw_chatbook/css/check_bundle_sync.py
