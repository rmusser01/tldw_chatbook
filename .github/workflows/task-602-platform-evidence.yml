name: TASK-602 native Parakeet evidence

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-evidence:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'task-602-platform-evidence'
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - evidence_name: linux-x86_64
            os: ubuntu-24.04
          - evidence_name: linux-aarch64
            os: ubuntu-24.04-arm
          - evidence_name: windows-x86_64
            os: windows-2022
          - evidence_name: macos-arm64
            os: macos-15
          - evidence_name: macos-x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize failure evidence
        run: python .github/scripts/task602_platform_evidence.py --initialize --evidence-name "${{ matrix.evidence_name }}" --output "$RUNNER_TEMP/task-602-platform-evidence.json"

      - name: Install Parakeet evidence dependencies
        id: dependencies
        continue-on-error: true
        run: python -m pip install -e '.[transcription_parakeet_onnx,transcription_faster_whisper]'

      - name: Record dependency installation failure
        if: steps.dependencies.outcome != 'success'
        run: python .github/scripts/task602_platform_evidence.py --record-failure dependency_install --failure-stage dependency_install --evidence-name "${{ matrix.evidence_name }}" --output "$RUNNER_TEMP/task-602-platform-evidence.json"

      - name: Run bounded native Parakeet smoke
        id: native_smoke
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: python .github/scripts/task602_platform_smoke.py --evidence-name "${{ matrix.evidence_name }}" --output "$RUNNER_TEMP/task-602-platform-smoke.json"

      - name: Normalize native smoke evidence
        if: always() && steps.dependencies.outcome == 'success'
        run: python .github/scripts/task602_platform_evidence.py --from-smoke "$RUNNER_TEMP/task-602-platform-smoke.json" --smoke-outcome "${{ steps.native_smoke.outcome }}" --evidence-name "${{ matrix.evidence_name }}" --output "$RUNNER_TEMP/task-602-platform-evidence.json"

      - name: Validate platform evidence
        if: always()
        run: python .github/scripts/task602_platform_evidence.py --validate "$RUNNER_TEMP/task-602-platform-evidence.json"

      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-602-platform-${{ matrix.evidence_name }}
          path: ${{ runner.temp }}/task-602-platform-evidence.json
          if-no-files-found: error
