name: Managed plugin qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tldw_chatbook/Plugins/**"
      - "tldw_chatbook/Agents/hooks_v2/**"
      - "Tests/Plugins/**"
      - "Tests/Agents/test_hooks_v2_*.py"
      - ".github/workflows/plugin-qualification.yml"

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
      TLDW_TEST_MODE: "1"
      HF_HUB_OFFLINE: "1"
      TLDW_TEST_GC_EVERY: "1"
      PLUGIN_COLLECTION_ARTIFACT: plugin-collected-nodes.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared core and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Create private execution profile before product imports
        shell: python
        run: |
          import json, os, tempfile
          from pathlib import Path
          profile = Path(tempfile.mkdtemp(prefix="plugin-qualification-", dir=os.environ["RUNNER_TEMP"]))
          profile.chmod(0o700)
          for name in ("home", "config", "data", "data/user", "cache"):
              (profile / name).mkdir(parents=True, mode=0o700)
          config = profile / "config/config.toml"
          config.write_text('[general]\nusers_name = "user"\n[paths]\ndata_dir = ' + json.dumps(str(profile / "data")) + '\n')
          config.chmod(0o600)
          values = {"HOME": str(profile / "home"), "XDG_CONFIG_HOME": str(profile / "config"),
                    "XDG_DATA_HOME": str(profile / "data"), "XDG_CACHE_HOME": str(profile / "cache"),
                    "TLDW_CONFIG_PATH": str(config), "QUALIFICATION_DATA_ROOT": str(profile / "data/user")}
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(key + "=" + value + "\n")
      - name: Record exact execution identity
        shell: python
        run: |
          import importlib.metadata, json, os, platform, sys
          from pathlib import Path
          Path("qualification-identity.json").write_text(json.dumps({
              "revision": os.environ["GITHUB_SHA"],
              "platform": platform.platform(), "python": sys.version,
              "executable": sys.executable,
              "configuration": "core+dev; private pytest profiles; null keyring; offline",
              "packages": {name: importlib.metadata.version(name) for name in
                           ("textual", "pydantic", "httpx", "portalocker", "jsonschema", "referencing")},
              "qualification": "Only executed passing boundaries qualify; skips remain unqualified."
          }, indent=2))
      - name: Exercise explicit lifecycle and regression boundaries
        shell: python
        run: |
          import os, runpy, sys
          from pathlib import Path
          checkout = Path.cwd().resolve()
          sys.path.insert(0, str(checkout))
          from Tests.hooks_v2_process_support import bootstrap
          bootstrap(str(checkout), dict(os.environ), os.environ["QUALIFICATION_DATA_ROOT"])
          sys.argv = ["pytest",
              'Tests/Plugins/test_plugin_end_to_end.py',
              'Tests/Plugins/test_owned_hook_acceptance.py',
              'Tests/Plugins/test_recovery.py',
              'Tests/Plugins/test_data_cleanup.py',
              'Tests/Agents/test_hooks_v2_mcp_execution.py',
              'Tests/Performance/test_app_startup_performance.py',
              'Tests/DB/test_private_sqlite_inventory.py',
              'Tests/Plugins/test_runtime_owner.py',
              'Tests/Plugins/test_package_files.py',
              'Tests/Plugins/test_git_acquisition.py',
              'Tests/Plugins/test_source_service.py',
              'Tests/Plugins/test_revocation_persistence.py',
              'Tests/Plugins/test_credential_authority.py',
              'Tests/Plugins/test_cursor_adapter.py',
              'Tests/Plugins/test_codex_adapter.py',
              'Tests/Plugins/test_vendor_hook_adapters.py',
              'Tests/Agents/test_hooks_v2_execution.py',
              'Tests/Agents/test_hooks_v2_budgets.py',
              'Tests/Agents/test_hooks_v2_post_checkpoints.py',
              'Tests/Agents/test_run_hooks.py',
              "Tests/Plugins/test_platform_selection.py",
              "-p", "Tests.Plugins.platform_support",
              "-q", "-ra", "--junitxml=plugin-qualification.xml"]
          runpy.run_module("pytest", run_name="__main__")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-qualification-${{ matrix.os }}
          path: |
            qualification-identity.json
            plugin-qualification.xml
            plugin-collected-nodes.json
          if-no-files-found: warn
