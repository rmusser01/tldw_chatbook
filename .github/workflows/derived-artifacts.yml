name: Derived Artifacts

# TASK-19572: one small check that actually runs, instead of a comprehensive
# suite that never reports.
#
# The `Tests` workflow has produced no verdict since 2026-06-26: a full pass
# takes 200-227 minutes, `dev` absorbs 23-50 merges/day, and its
# cancel-in-progress rule kills every in-flight run long before it finishes.
# Guards that live only inside that suite -- the diagnostic-inventory pin and
# the profile-owned-path census -- have therefore never blocked anything, and
# the same drift has been rediscovered by hand in four separate tasks.
#
# Every derived-artifact check is stdlib-only and needs no dependency install.
# Measured on an M-series laptop: bundle-sync 0.86 s, profile-owned-path 10.98 s,
# diagnostic inventory 20.17 s, backlog ids <0.5 s, chachanotes table allowlist
# 0.10 s -- ~33 s of work, ~90 s with checkout and setup-python. That budget is
# small enough to run on every PR, which makes it usable as a required check.

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main]
  # Merge queue (Docs/superpowers/specs/2026-10-03-merge-queue-design.md): a dispatch without
  # `pr` on dev is a queue kick: the lanes skip and only queue-tick runs. The queue sends one
  # itself (with `wait_run`) to wake a tick after a run finishes, because GitHub only starts a
  # workflow_dispatch run for a file that exists on main, and this is the queue file that does.
  # The queue no longer dispatches the required check on a PR head: a dispatched run's check is
  # not in the PR's status rollup, so it never satisfies protection (spec V4). A dispatch with
  # `pr`, or without `pr` on any other branch, runs the full gate, so the required check can
  # never go green without tests actually running.
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (manual full-gate dispatch)
        required: false
        type: string
        default: ''
      wait_run:
        description: A run the queue tick waits for before deciding (set by the merge queue)
        required: false
        type: string
        default: ''

# Deliberately NOT path-filtered.
#
# A required status check that is skipped by a path filter never reports at all;
# GitHub leaves the PR sitting on "Expected - waiting for status to be
# reported", forever. Any PR that touched only docs would be unmergeable. The
# usual workaround (a twin workflow with the same job name that always passes)
# buys nothing here, because the job is ~90 s: just run it. If you are tempted
# to add `paths:` below, you are about to brick merges -- don't.

# One run per workflow per ref for PUSH events: a new push to `dev` supersedes
# the previous run instead of queueing another alongside it. Without this, every
# push to `dev` stacked a full run - 50+ obsolete runs accumulated, all competing
# for the shared account pool. The event name is part of the group so different
# trigger types never cancel each other, and `main` is never cancelled so its
# history stays complete.
#
# TASK-21250: pull_request runs are deliberately NOT cancelled. The original rule
# reasoned that cancelling is safe because "the newest run is the one that reports
# for HEAD" - true, but it assumed the newest run gets to FINISH. For a
# pull_request event `github.ref` is `refs/pull/N/merge`, and GitHub recreates
# that merge ref every time the BASE branch moves. On a repo absorbing 23-50
# merges/day, every open PR's gate was therefore cancelled repeatedly without
# anyone touching the PR, and because queue time for the shared pool runs
# 4-59 minutes (vs ~33 s of actual work), the newest run rarely survived long
# enough to report. Measured over 60 consecutive runs before this change:
# 45 cancelled / 14 success / 1 failure - a 23% success rate for a REQUIRED
# check, i.e. merges to `dev` were blocked at random for everyone.
#
# The cost of not cancelling is a few redundant ~90 s ubuntu runs on a
# rapidly-updated PR. That is the cheaper failure mode by a wide margin.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pr-fast-lane:
    name: PR Fast Lane
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.pr != '' || github.ref != 'refs/heads/dev'))
    runs-on: ubuntu-latest
    # TASK-32831: the main and admission-sensitive invocations measured 14m45s
    # and 4m59s, plus setup; keep both required steps within one bounded job.
    timeout-minutes: 35  # B1 (TASK-33910.2): owner decision 2026-10-09, raised 30 -> 35 to fit B1's mounted Roleplay suites (~27m07s worst case)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install fast-lane dependencies
        run: python -m pip install -e . pytest pytest-asyncio pytest-timeout packaging

      - name: Run fast PR contract
        run: |
          pytest \
            Tests/CI \
            Tests/test_smoke.py \
            Tests/MCP/test_approval_timeout_policy.py \
            Tests/MCP/test_control_plane_bridge.py \
            Tests/MCP/test_live_server_request_wiring.py \
            Tests/Agents/test_execution_capacity.py \
            Tests/Agents/test_fleet_messages.py \
            Tests/Agents/test_session_todo_store.py \
            Tests/DB/test_agent_orchestration_dev_migration.py \
            Tests/DB/test_agent_run_budget_accounting.py \
            Tests/DB/test_automatic_work_budget.py \
            Tests/DB/test_automatic_runtime_owner.py \
            Tests/DB/test_automatic_wake_attempts.py \
            Tests/Model_Artifacts/test_operation_leases.py \
            Tests/Model_Artifacts/test_operation_leases_process.py \
            Tests/UI/test_mcp_workbench.py \
            Tests/UI/test_mcp_tools_mode.py \
            Tests/Widgets/test_detach_safe_text_area.py \
            Tests/Architecture/test_console_controllers_define_their_self_attributes.py \
            Tests/Architecture/test_flush_screens_have_quit_hooks.py \
            Tests/Architecture/test_quit_flow_prompt_choke_point.py \
            Tests/Library/test_library_note_autosave_max_wait.py \
            Tests/Library/test_library_file_export.py \
            Tests/Architecture/test_notes_sync_snapshot_construction.py \
            Tests/Library/test_library_media_source_link.py \
            Tests/Library/test_library_notes_canvas_pending_lookup.py \
            Tests/Architecture/test_notes_sync_binding_profile_commits.py \
            Tests/Architecture/test_notes_sync_version_proxy_sites.py \
            Tests/Agents/test_mcp_unavailable_builtin_tools.py \
            Tests/Chat/test_console_arrival_vocabulary.py \
            Tests/Chat/test_console_trace_missing_revision_diagnostic.py \
            Tests/Chat/test_first_reply_failure_copy.py \
            Tests/Chat/test_first_token_window.py \
            Tests/Architecture/test_surface_swap_guard.py \
            Tests/Library/test_ingest_analysis_load_settings.py \
            Tests/test_config_load_settings_table_guard.py \
            Tests/Architecture/test_study_handler_service_keywords.py \
            --timeout=180 \
            --tb=short

      # TASK-32873: the admission-sensitive suites enroll the process
      # against the collection-time profile (keep_bootstrap_profile in
      # Tests/conftest.py); running them in the SAME pytest invocation as
      # sandboxed suites lets the enrollment poison their config access
      # (RecoveryRequired: raw_source_selection_changed). Their own
      # invocation, after the sandboxed one, keeps both green.
      # Roleplay frame B1 (TASK-33910.2): the mounted Roleplay frame suites (both
      # styled tiers, hostile names, the journeys) are bootstrap_profile files too.
      - name: Run admission-sensitive suites
        if: always()
        run: |
          pytest \
            Tests/Chat/test_console_run_log_connection_ownership.py \
            Tests/Chat/test_console_chat_create_connection_ownership.py \
            Tests/DB/test_chachanotes_connection_quiescence.py \
            Tests/DB/test_operation_owned_connection_retirement.py \
            Tests/UI/test_console_runtime_ownership.py \
            Tests/Chat/test_console_viewless_hooks.py \
            Tests/Agents/test_install_skill_runtime_tool.py \
            Tests/Chat/test_console_chat_create_integration.py \
            Tests/Notes/test_notes_sync_tail_edit.py \
            Tests/Notes/test_notes_sync_delete_restore_signal.py \
            Tests/Notes/test_notes_sync_crlf_single_line.py \
            Tests/Notes/test_notes_sync_source_moved_settle.py \
            Tests/Notes/test_notes_sync_watcher_after_heal.py \
            Tests/Notes/test_notes_sync_version_only_move.py \
            Tests/Notes/test_notes_sync_resave_window.py \
            Tests/Notes/test_notes_sync_attention_fence.py \
            Tests/Agents/test_first_request_window_honest_plan.py \
            Tests/Chat/test_console_capacity_refusal_copy.py \
            Tests/UI/test_roleplay_frame_harness.py \
            Tests/UI/test_roleplay_header.py \
            Tests/UI/test_roleplay_hostile_names.py \
            Tests/UI/test_roleplay_journeys.py \
            --timeout=300 \
            --tb=short

  ui-fast-lane:
    # TASK-32908. Until now `Tests/UI` -- 25,917 collected tests, the biggest
    # directory in the tree -- gated NOTHING on a pull request.
    #
    # It looks covered twice over and is covered neither time:
    #   * test.yml has a 12-shard `ui-tests` job, but that workflow is
    #     `on: push: branches: ["main"]` + workflow_dispatch. It does not accept
    #     pull_request events, so nothing in it is a PR gate.
    #   * nightly-deep.yml runs `pytest ./Tests/` on a schedule -- with no
    #     --continue-on-collection-errors, so one bad import aborts the session.
    #     It has been doing exactly that: run 35706024071 (2026-09-22) reported
    #     `collected 101851 items / 1 error` then `Interrupted`, ZERO tests
    #     executed, six consecutive nights.
    #
    # The whole directory cannot come into the gate: measured 25,917 tests /
    # ~5.5 CPU-hours. What comes in is a verified-green subset, listed in
    # scripts/ui_pr_gate_census.txt.
    #
    # Deliberately SERIAL and on the same minimal dependency set as
    # pr-fast-lane. No xdist, no pytest-randomly in requirements-test.txt, and
    # a pinned file ORDER -- so the run CI performs is the same run the census
    # was verified against. A gate whose green was only ever observed under a
    # different plugin set and a different test order is a gate that lands red,
    # and a red gate trains people to ignore it.
    #
    # Its own job rather than another step on pr-fast-lane: that lane measured
    # ~20 min against a 30-min cap, and spending its last headroom here would
    # make the required check fail on a timeout the first time either half grew.
    #
    # TASK-34353: the serial census itself then reached 14-19 min against this
    # job's 20-min cap, and PRs adding census files timed out with zero failing
    # tests (#2992 three times). So the census runs as round-robin shards
    # (`check_ui_pr_gate_census.py --shard`): each shard is a subsequence of
    # the census, in census order, on the same minimal dependency set. What
    # changes is only which files run before a given file -- a file that needed
    # a particular predecessor was relying on leaked state, which is a bug the
    # split surfaces, not hides. Add a shard (not minutes) when one nears the cap.
    name: UI Fast Lane
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.pr != '' || github.ref != 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Report every shard, so one red shard does not hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Same line as pr-fast-lane, on purpose: the census is verified against
      # this dependency set. Adding a package here can only be done by
      # re-verifying the census under it.
      - name: Install fast-lane dependencies
        run: python -m pip install -e . pytest pytest-asyncio pytest-timeout packaging

      - name: Run the gated Tests/UI slice
        run: |
          # Census order is the run order; see the checker for why it may not
          # silently shrink. Written to a file first so a failing checker fails
          # the step (bash -e) instead of yielding an empty list.
          python scripts/check_ui_pr_gate_census.py --shard \
            "${{ strategy.job-index }}" "${{ strategy.job-total }}" \
            > "$RUNNER_TEMP/ui-shard.txt"
          mapfile -t SHARD < "$RUNNER_TEMP/ui-shard.txt"
          # An empty shard would make bare `pytest` collect the whole tree.
          test "${#SHARD[@]}" -gt 0
          echo "Gating shard $(( ${{ strategy.job-index }} + 1 ))/${{ strategy.job-total }}: ${#SHARD[@]} Tests/UI files."
          pytest "${SHARD[@]}" \
            --timeout=180 \
            --tb=short

  derived-artifacts:
    # This job's name is the string the owner enters under branch protection ->
    # required status checks. Renaming it silently detaches the gate, so keep it
    # stable.
    name: Derived artifacts reproduce from their sources
    needs: [pr-fast-lane, ui-fast-lane]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The Mermaid builder's immutable input manifest pins 3.12.11 byte
          # generation. No `cache: pip` -- nothing is installed.
          python-version: '3.12.11'

      - name: Require successful PR fast lane
        if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.pr != '' || github.ref != 'refs/heads/dev'))) && needs.pr-fast-lane.result != 'success' }}
        run: |
          echo "PR Fast Lane result: ${{ needs.pr-fast-lane.result }}"
          echo "::error::The required PR fast lane did not succeed."
          exit 1

      # TASK-32908: same shape as the step above. Without it the new UI job
      # would report its own red square while the REQUIRED check stayed green,
      # which is the "guard nobody is gated on" failure this workflow exists to
      # avoid.
      - name: Require successful UI fast lane
        if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.pr != '' || github.ref != 'refs/heads/dev'))) && needs.ui-fast-lane.result != 'success' }}
        run: |
          echo "UI Fast Lane result: ${{ needs.ui-fast-lane.result }}"
          echo "::error::The required UI fast lane did not succeed."
          exit 1

      # Every step below is `if: '!cancelled()'` rather than the default
      # `success()`: a burn-down run must report ALL of the drift in one pass.
      # With the default, the first red checker hides the other three and the
      # fix-and-push loop runs once per checker.

      - name: Generated stylesheets reproduce from their sources
        if: ${{ !cancelled() }}
        run: |
          # Rebuilds both bundles into a temp dir and diffs them against the
          # committed sheets, naming any drifted MODULE block.
          python tldw_chatbook/css/check_bundle_sync.py

      - name: Canvas Mermaid assets reproduce from pinned public inputs
        if: ${{ !cancelled() }}
        run: |
          # Downloads only the exact hash/size-pinned public inputs into a
          # temporary directory, runs the existing offline build there, and
          # compares its complete output closure with packaged static bytes.
          python scripts/check_canvas_mermaid_assets.py

      - name: Profile-owned path census matches its approved exceptions
        if: ${{ !cancelled() }}
        run: |
          # Prints path:line:context:expression:reason for every unapproved
          # occurrence of a historical profile-owned path root.
          python scripts/check_profile_owned_path_inventory.py

      - name: Production diagnostic inventory matches the source tree
        if: ${{ !cancelled() }}
        run: |
          # On drift this prints the full committed-vs-rebuild report -- rows
          # only-in-committed / only-in-rebuild / changed with
          # old_count/old_digest -> new_count/new_digest, sink-topology deltas,
          # and the exact next command. Read the rows before regenerating: the
          # artifact exists to make an unreviewed --write impossible to do by
          # accident.
          python scripts/check_persistent_diagnostic_inventory.py

      - name: Backlog task IDs are unique
        if: ${{ !cancelled() }}
        run: |
          # The only place this check runs -- covered by the one required
          # status check rather than by a path-filtered workflow nobody is
          # gated on.
          python scripts/check_backlog_task_ids.py

      - name: Backlog task files are readable
        if: ${{ !cancelled() }}
        run: |
          # A task whose frontmatter does not load is skipped by every reader
          # with one log line, so it silently stops existing. Thirty-two files
          # had accumulated that way before PR #1954 repaired them; nothing
          # stopped them coming back.
          python scripts/check_backlog_task_files.py

      - name: ChaChaNotes table allowlist covers every migrated table
        if: ${{ !cancelled() }}
        run: |
          # TASK-20971. Statically scans the CREATE TABLE statements in
          # DB/migrations/chachanotes_*.sql and in ChaChaNotes_DB.py's SQL
          # string literals, and fails when VALID_TABLES['chachanotes'] does
          # not list one of them (or lists one nothing creates). Prints the
          # exact lines to paste. No database is built; runtime is milliseconds,
          # so this does not move the ~90 s budget this job depends on.
          python scripts/check_schema_table_allowlist.py

      - name: Every database index has a query-plan decision on record
        if: ${{ !cancelled() }}
        run: |
          # TASK-21593. No DB module in this repo runs ANALYZE, so no user's
          # database has a sqlite_stat1 and the planner can ignore a textbook
          # index entirely -- TASK-21126 shipped 5 MB of dead index that way,
          # with a green "the index exists" test. This scans the CREATE INDEX
          # names in DB/ and fails when one is missing from
          # scripts/index_plan_pin_census.tsv, so adding an index has to stop
          # at "plan-pinned or pre-convention?". Pure text scan, no database
          # built; milliseconds, so it does not move this job's ~90 s budget.
          python scripts/check_index_plan_pins.py

      - name: Textual workers and post-await DOM lookups keep their contract
        if: ${{ !cancelled() }}
        run: |
          # TASK-32800.4. Three of the four P0s in the 2026-09-17 core-runtime
          # review were one defect class with no guard: a synchronous callable
          # handed to run_worker (Worker._run_async raises, exit_on_error
          # defaults to True, the app exits), and a query_one that resumes
          # after an await into a subtree something else removed. W001 is a
          # hard gate -- the tree has zero violations, so any new one is real.
          # W002 is a census ratchet over the 279 pre-existing post-await
          # lookups, because whether one can crash is not statically decidable
          # and failing on all of them would be a guard that gets muted. Pure
          # AST scan, stdlib only; seconds.
          python scripts/check_textual_worker_contract.py
      - name: Timestamp writers go through the shared UTC helper
        if: ${{ !cancelled() }}
        run: |
          # ADR-173 / TASK-32803.1. datetime.utcnow() (deprecated, naive) is
          # forbidden, and naive datetime.now().isoformat() writers are pinned
          # in scripts/timestamp_writer_census.tsv as a ratchet that only
          # shrinks as TASK-32803.5 adopts Utils/timestamps.py. Fails on a new
          # or grown naive-timestamp writer. Pure AST scan, no database built.
          python scripts/check_timestamp_writers.py

      - name: The gated Tests/UI census is intact
        if: ${{ !cancelled() }}
        run: |
          # TASK-32908. The ui-fast-lane job above is the ratchet on BEHAVIOUR
          # -- a censused file that goes red turns it red. This is the ratchet
          # on the census itself: every listed path must still exist (a renamed
          # file makes pytest collect less while still exiting 0), and the list
          # may not fall below its pinned floor, so "delete the line" stops
          # being the cheapest way to make the gate green. Pure path check;
          # milliseconds.
          python scripts/check_ui_pr_gate_census.py

  queue-tick:
    # Wakes the merge queue after CI finishes, for any same-repo PR run (including the held runs
    # the queue approves after its rebase) and for the queue's own kicks on dev. Deliberately no auto_merge check: the event payload is a trigger-time
    # snapshot, and the documented disarm-push-rearm flow leaves it null, so a red author run
    # would never wake the queue. The script itself only acts on the armed line. NOT a required
    # check and NOT in the aggregate's needs: a queue failure can never turn `Derived artifacts
    # reproduce from their sources` red. Pushes to dev are merge-queue.yml's job.
    # Security (spec section 9): a queue-approved held run executes the PR branch's copy of this
    # file, so the branch controls these write permissions, exactly as a same-repo pull_request
    # run already does. The difference is the actor (github-actions[bot] skips GitHub's
    # Dependabot and agent-push gates), which is why the queue only queues PRs opened by a user.
    # Spec: Docs/superpowers/specs/2026-10-03-merge-queue-design.md
    name: Merge queue tick
    needs: [derived-artifacts]
    if: >-
      !cancelled() &&
      (vars.MERGE_QUEUE == 'dry' || vars.MERGE_QUEUE == 'on') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
      - name: Advance the queue
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_QUEUE: ${{ vars.MERGE_QUEUE }}
          WAIT_RUN: ${{ inputs.wait_run }}
        run: python3 scripts/merge_queue.py

