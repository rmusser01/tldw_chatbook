        run: python -m pip install -e . pytest pytest-asyncio pytest-timeout packaging aiohttp-jinja2
      - name: Run managed plugin recovery UI journeys
        run: |
          pytest \
            Tests/UI/test_plugins_browse.py::test_restored_plugins_recover_from_the_plugins_screen \
            Tests/UI/test_plugins_browse.py::test_reset_after_restore_sets_plugins_aside_and_kept_data_reattaches \
            --timeout=300 --tb=short --junitxml=plugin-recovery-ui.xml
      - name: Require both managed plugin recovery journeys to execute
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("plugin-recovery-ui.xml").iter("testcase"))
          assert len(cases) == 2, "Expected both managed plugin recovery journeys"
          assert all(
              case.find(tag) is None
              for case in cases
              for tag in ("skipped", "failure", "error")
          ), "Managed plugin recovery requires two executed passing cases"

  console-p0-gate:
    needs: [preflight]
    # TASK-33621.27. The 2026-09-29 Console review's P0 fixes shipped with
    # regression tests no pull-request lane ran; two of them drifted red on
    # dev within days and nobody saw. This job is where they run.
    #
    # Its own job, not more steps on pr-fast-lane: PR #3062 first put them
    # there and that job took 33m41s against its 35-min cap (run
    # 38064483856: main step 13m08s, admission-sensitive step 19m30s, of
    # which this block was 3m01s). Like ui-fast-lane, it is a separate
    # runner, so it costs one more concurrent runner per PR (6 test runners
    # then; ADR-103's dated notes keep the current count), and no wall-clock
    # on the PR Fast Lane.
    #
    # Same minimal dependency set, same serial pytest, same profile split as
    # pr-fast-lane (TASK-32873): plain unit, private-profile and in-process
    # tests in one invocation; bootstrap_profile ones (a file with even one
    # such node, e.g. test_console_compaction_failure.py: 1 of 28) in a
    # separate invocation. A fast file is gated whole; a slow file by the node
    # ids that pin the P0. The UI-census node ids stay in ui-fast-lane.
    # Tests/CI/test_console_p0_regression_gate.py pins where each one runs.
    #
    # Historical combined budget: setup ~1 min (checkout 20 s, python 3 s, install 19 s
    # in run 38064483856) + sandboxed step ~3 min (6 private-profile app
    # boots at ~15-20 s each in CI plus ~1 min of unit/DB tests) + admission
    # step ~5 min (the 3m01s measured block + the 20-action row sweep at ~6 s
    # an action + one unit node) = ~9 min. 20 gives 2x for runner slowness
    # (the dev-equivalent admission step varied 11m33s-19m30s).
    #
    # TASK-34986: PR2921's two Dreams/Guardian steps took this job to max
    # 18.7 min of 20; they run in dreams-boundary now, and the two Console
    # P0 steps replay at median 11.6 / max 13.9 min over the 76 runs that
    # finished. In the two runs cancelled at the cap they alone took ~17.5
    # (a failing run) and ~16.1 min with setup: about 4 min of headroom at
    # worst, not 6.
    # TASK-40724: run 43487945840 exhausted 20min in the first invocation.
    # Separate the existing profiles; each retains its own test deadlines.
    name: Console P0 regression gate (${{ matrix.profile }})
    if: needs.preflight.outputs.full == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.release || inputs.pr != '' || github.ref != 'refs/heads/dev')))
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [sandboxed, restore, admission-sensitive]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # pr-fast-lane's line plus hypothesis (TASK-42028): the admission step's
      # agent-call thinking file imports Tests/Agents/test_fleet_continuation.py,
      # which imports hypothesis. So does the sandboxed step's query-synthesis
      # file (TASK-42008).
      - name: Install fast-lane dependencies
        run: python -m pip install -e . pytest pytest-asyncio pytest-timeout packaging aiohttp-jinja2 hypothesis

      # TASK-41508 (2026-11-18): the trace provenance file, whose constructor
