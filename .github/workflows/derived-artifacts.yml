  pr-fast-lane-arch:
    needs: [preflight]
    # The 2026-10-25 architecture-review program's 14 tests, which ran in no
    # pull-request lane. A first attempt appended them to pr-fast-lane, whose
    # run then hit its 35-min cap (PR #3399); the job's own note says to add
    # a job, not minutes. Their own job, so no existing lane moves toward its
    # cap: one invocation, same minimal dependency set and serial pytest as
    # the other lanes. Those 14 ran in about 2.5 min locally.
    # TASK-37173: PR #3494 reached the 35-minute fast-lane cap at 99%.
    # Run the four package-wide AST censuses here, where the same attempt
    # took 2m28s against this job's 20-minute cap.
    # PR #3499's tests finished five seconds before the fast lane was
    # cancelled at 35 minutes. Keep the import, config and CSS guards here
    # under the same per-test limit to give that lane room to exit.
    #
    # TASK-39114 appends the private-SQLite registry and inventory files, red
    # on no required lane before. Tests/DB keeps the bootstrap profile, so they
    # run after every sandboxed target (TASK-32873); with them the step took 5-8 min locally at load
    # 32-52. The inventory's response-rule node also runs in console-p0-gate,
    # so the exclusive recovered-suites and Architecture guard jobs cannot
    # take the file.
    #
    # The program's Phase 3 tests, in no PR lane before: the sandboxed ones
    # go before the TASK-39114 files, and the bootstrap-profile ones
    # (module marker, Tests/DB) after them, last (TASK-32873). Their 191
    # tests took 2.5 min serially in this job's install set at load ~50.
    #
    # TASK-41136: the Console provider gateway file (bootstrap_profile, so
    # last), on no PR lane before: 494 tests, 4.1 min serially at load ~56.
    # Its three deselected nodes are red on dev, owned by TASK-41053.
    #
    # The media body-move series (TASK-36952.3): its Architecture wiring pins
    # (sandboxed, so before the TASK-39114 files), in no PR lane before; 16
    # tests, 9 s serially in this job's install set at load ~22.
    name: PR Fast Lane (architecture-review tests)
    if: needs.preflight.outputs.full == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.release || inputs.pr != '' || github.ref != 'refs/heads/dev')))
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Same line as pr-fast-lane, on purpose (see ui-fast-lane's note).
      - name: Install fast-lane dependencies
        run: python -m pip install -e . pytest pytest-asyncio pytest-timeout packaging aiohttp-jinja2

      - name: Run the architecture-review tests
        run: |
          pytest \
            Tests/DB/test_store_error_bases.py \
            Tests/Chat/test_approval_constants.py \
            Tests/Chat/test_console_environment_state.py \
            Tests/Utils/test_character_display_text_shim.py \
