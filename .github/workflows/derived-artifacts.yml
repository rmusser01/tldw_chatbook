  recovered-suites:
    needs: [preflight]
    # Owner decision (2026-11-06): one job for the non-UI suites that were red
    # in no PR lane and are now runnable (TASK-38111's RecoveryRequired fix,
    # TASK-38973's stub screens, TASK-38756's prompt pins), serial under
    # --storage-lease-guard. Its own job, so the Dreams boundary job keeps its
    # margin and pr-fast-lane (at its 35-min cap) gains nothing. One more
    # runner per PR (ADR-103 note, 2026-11-07).
    #
    # One invocation, sandboxed suites first, then the bootstrap_profile ones
    # (module pytestmark): their enrollment would break a sandboxed suite that
    # followed them and read config in-process (TASK-32873). A sandboxed
    # suite whose path reads no config in-process may follow them; the step
    # note names the one that does.
    name: PR lane (recovered suites)
    if: needs.preflight.outputs.full == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.release || inputs.pr != '' || github.ref != 'refs/heads/dev')))
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
    # Owner decision (2026-11-19): 30 min, still one serial job. Over 24 PR
    # runs (2026-11-18/19), 19 took 16 min or more and 5 hit the old 20-min
    # cap, 4 of them with no test failing.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Same line as pr-fast-lane, on purpose (see ui-fast-lane's note).
      - name: Install fast-lane dependencies
        run: python -m pip install -e . pytest pytest-asyncio pytest-timeout packaging aiohttp-jinja2

      # TASK-39043: the Console config-sync lifetime and Home citation
      # retirement suites (~86 s serial each). TASK-38976: the prompt
      # scope-service and batch suites. TASK-38974: the four Tests/Docs files
      # (sandboxed, ~8 s serial). TASK-38948: the subscription
      # background-readiness file (sandboxed, ~6 s), on no lane before.
      # Then the bootstrap_profile suites:
      # TASK-39142's prompt-improvement and keyword-leg files, with TASK-39049's
      # keyword-leg pool retirement file beside them, and TASK-39049's Library
      # ingest runner. TASK-39124 appends the built-in pixel buddy file
      # (sandboxed, ~2.5 min serial at load 105-117), last as asked. It may
      # follow the bootstrap_profile suites because nothing on its path reads
      # config in-process: BuddyLibrary.ensure_builtin and ChaChaNotes take no
      # config, its readiness cases patch get_user_data_dir, and with no
      # app_config the Buddy-preference migration returns before its writer
      # (Persona_Buddy/library.py, migrate_legacy_selection). TASK-39119's
      # wake and goal-iteration reply pins follow, by node: the three fleet-wake
      # nodes are private-profile tests (each body runs in its own child
      # process); the four other fleet-wake nodes stay in pr-fast-lane.
      # TASK-39168 runs the goal-dispatch file whole (bootstrap_profile) in
      # place of its three reply-pin nodes. Then the goal recovery file
      # (bootstrap_profile, 4 tests), which runs on no other lane. TASK-39149's
      # two Trace export credential nodes (pure, no config read, ~5 s serial)
      # follow the sandboxed prompt suites, before the bootstrap_profile ones.
      # Round 13:
      # TASK-39172's config participant lifetimes join the sandboxed block (it
      # reads config in-process, so it runs before any bootstrap suite); the
      # Console files of TASK-39154 (rewind/summarize, per-session run state),
      # TASK-39164 (edit-and-resend, regenerate branching) and TASK-40097's
      # controller node are bootstrap_profile and follow the goal recovery file.
      # Then TASK-39163's automatic Library preparation file (bootstrap_profile).
      # TASK-39153 appends the Library ingest flow file (bootstrap_profile, 13 tests).
      # Round 14: TASK-40316 appends the regenerate variant-stream file
      # (bootstrap_profile, 19 tests), on no lane before.
      # TASK-40323 adds the first-run wizard's subscription-readiness file
      # (sandboxed, ~9 s) after the background-readiness one, and, last, the
      # green held-pointer case and 14 green stock skill-trust cases
      # (bootstrap_profile; each a private subprocess, ~30-45 s serial).
      # TASK-40301's four Trace export nodes (pure) and TASK-40303's
      # legacy-ledger node (in-memory DB) follow TASK-39149's.
      # Round 15: TASK-41112's Actor Pack export file (sandboxed, ~83 s serial
      # at load 104) joins the sandboxed block, before the bootstrap ones.
      # Round 16: TASK-41521's persona coordinator file (sandboxed, 13-15 s
      # under this step's flags at load 12-16) follows it. TASK-41516 moves
      # the Library Skills recovery controls file here from pr-fast-lane
      # (sandboxed, 14 tests, 79 s under this step's flags at load 14-18; its
      # TASK-41123 node is 21 s in CI) and lanes test_fleet_wake_retry.py
      # (3 private-profile tests, 18 s) after the three fleet-wake nodes.
      # Round 15: TASK-41133's label-list, must-mask and must-keep table,
      # bracket, next-field, code-span, cache, re-mask-on-import and timing
      # nodes (pure, two CPU-time ratios) join the Trace export nodes, and
