  pr-fast-lane-admission:
    # TASK-34916: the PR Fast Lane's second pytest invocation, moved here
    # unchanged (same targets, same order, same --timeout) so the two halves
    # run side by side instead of one after the other. It was always its own
    # pytest process; each process makes its own throwaway bootstrap profile
    # (mkdtemp in Tests/conftest.py), so nothing passed from the first
    # invocation to this one and a fresh runner changes nothing it relies on.
    #
    # timeout-minutes: the 35 the owner set for exactly these suites
    # (TASK-33910.2). Its 90 measured runs replay at median 16.3 / max 20.1
    # min with setup, so one hung test at --timeout=300 (about 5.3 min with
    # the private-profile wrapper's report) still ends ~10 min under the cap.
    #
    # One more runner per PR (ADR-103 note, 2026-10-14).
    name: PR Fast Lane (admission-sensitive)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.pr != '' || github.ref != 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Same line as pr-fast-lane, on purpose (see ui-fast-lane's note).
      - name: Install fast-lane dependencies
        run: python -m pip install -e . pytest pytest-asyncio pytest-timeout packaging

      # TASK-32873: the admission-sensitive suites enroll the process
      # against the collection-time profile (keep_bootstrap_profile in
      # Tests/conftest.py); running them in the SAME pytest invocation as
      # sandboxed suites lets the enrollment poison their config access
      # (RecoveryRequired: raw_source_selection_changed). Their own
      # invocation keeps both green.
      # Roleplay frame B1 (TASK-33910.2): the mounted Roleplay frame suites (both
      # styled tiers, hostile names, the journeys) are bootstrap_profile files too.
      - name: Run admission-sensitive suites
        run: |
          pytest \
            Tests/Chat/test_console_run_log_connection_ownership.py \
            Tests/Chat/test_console_chat_create_connection_ownership.py \
            Tests/DB/test_chachanotes_connection_quiescence.py \
            Tests/DB/test_operation_owned_connection_retirement.py \
            Tests/UI/test_console_runtime_ownership.py \
            Tests/UI/test_console_partial_resize.py \
