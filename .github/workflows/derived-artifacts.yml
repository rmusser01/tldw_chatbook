  pr-fast-lane-admission-2:
    needs: [preflight]
    # TASK-35575 (owner decision, 2026-10-19): the admission-sensitive suites
    # run in two jobs side by side. pr-fast-lane-admission keeps dev's 41
    # targets; this job holds Phase 9's 54 model-config targets: the 52 in the
    # order they had there, then the Stop-claim fix's two (TASK-33666).
    # Together in one job, PR #3169's two runs took 29.8 and 27.4 min of its
    # 35 (the pytest step 1737 s and 1590 s), so one hung test at
    # --timeout=300 (about 5.3 min with the private-profile wrapper's report)
    # would have passed the cap. Serial in this job's install set the 52 alone
    # took 266.9 s (959 passed, 2026-10-19, load 7-9; the two added after take
    # about 1-3 s each, the pair 3.3-5.3 s serial), where all 93 took 1744.6 s
    # and then 1737 s and 1590 s on CI, so expect about 5 min of pytest and
    # 6-7 min with setup: a hung test's report ends well over 20 min under the
    # cap. TASK-33620.15.1.3 appends one mounted Console file (two tests,
    # ~8 s serial). TASK-33620.15.4 appends the durable commit window file
    # (three cases on a real file-backed commit, ~7 s serial).
    # TASK-33620.15.1.6 and .5 append two mounted Console files: the
    # Environment panel's consent reads stay off the UI loop (three tests)
    # and one helper answers every reader of a session's admitted roots (two
    # tests), about 10-15 s each serial.
    # TASK-33620.15.1.4 appends the rail edge focus restyle file (two mounted
    # Console tests, ~18 s serial).
    # TASK-34100.5.3 appends plain chat's
    # light tool surface suites (six files and three nodes, 76 tests), here
    # rather than in pr-fast-lane-admission, which keeps dev's targets.
    # TASK-33620.10 appends the
    # streaming-default pins: the shipped template and config loads (68
    # cases, ~4 s) and one mounted Console drip send (~22 s serial).
    # TASK-37421 appends the refused-stream retry pins: real adapters
    # against a loopback server (ten cases, ~12 s) and one mounted Console
    # send to a Custom server that refuses streaming (~8 s serial).
    #
    # Same runner, install line, cap and --timeout=300 as
    # pr-fast-lane-admission, and its own pytest process and bootstrap
    # profile, as there. One more runner per PR (ADR-103 note, 2026-10-19).
    name: PR Fast Lane (admission-sensitive 2)
    if: needs.preflight.outputs.full == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.release || inputs.pr != '' || github.ref != 'refs/heads/dev')))
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Same line as pr-fast-lane, on purpose (see ui-fast-lane's note).
      - name: Install fast-lane dependencies
        run: python -m pip install -e . pytest pytest-asyncio pytest-timeout packaging aiohttp-jinja2

      # TASK-37270: real startup/UI/provider/file evidence in a fresh process per case.
      # Existing required job; no extra runners or enlarged job budget (ADR-103).
      - name: Run project-chat UAT
        timeout-minutes: 18
        env:
          TLDW_UAT_ARTIFACTS: project-chat-uat
        run: >-
          pytest
          Tests/QA/test_project_chat_uat.py
          Tests/QA/test_project_chat_uat_support.py
          Tests/QA/test_project_chat_uat_reports.py
          -x -q -o addopts= --timeout=240 --tb=short
          --basetemp=project-chat-uat-pytest --junitxml=project-chat-uat.xml
      - name: Require complete project-chat UAT evidence
        if: always()
        run: python scripts/check_project_chat_uat.py --junit project-chat-uat.xml --artifacts project-chat-uat
      - name: Prove missing project evidence fails UAT
        timeout-minutes: 5
        env:
          TLDW_UAT_ARTIFACTS: project-chat-negative
          TLDW_UAT_NEGATIVE_CONTROL: missing-readme
        run: |
          status=0
          pytest 'Tests/QA/test_project_chat_uat.py::test_project_chat_uat[fenced]' \
            -q -o addopts= --timeout=240 --tb=short \
            --basetemp=project-chat-negative-pytest --junitxml=project-chat-negative.xml || status=$?
          test "$status" -eq 1
          python scripts/check_project_chat_uat.py --negative-control \
            --junit project-chat-negative.xml --artifacts project-chat-negative
      - name: Retain project-chat UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-chat-uat-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            project-chat-uat/
            project-chat-uat.xml
            project-chat-uat-pytest/**/pytest.log
            project-chat-uat-pytest/**/stacks.txt
            project-chat-uat-pytest/**/tldw_cli_app.log
            project-chat-negative/
            project-chat-negative.xml
            project-chat-negative-pytest/**/pytest.log
            project-chat-negative-pytest/**/stacks.txt
            project-chat-negative-pytest/**/tldw_cli_app.log

