  dreams-boundary:
    needs: [preflight]
    # TASK-34986: PR2921's Dreams and Guardian boundary steps, moved here
    # verbatim from console-p0-gate (same targets, order, --timeout and `if`).
    # With them that job measured median 16.1 / p90 17.4 / max 18.7 min over
    # 76 PR runs (2026-10-13 to 2026-10-14) against its 20-min cap, and two
    # runs were cancelled at the cap. Per step: Console P0 sandboxed median
    # 2.9 / max 3.5, admission-sensitive 7.8 / 9.7 (the row-menu action sweep
    # ~2 min of it), Dreams boundary 1.8 / 2.1, Dreams admission-sensitive
    # 2.6 / 3.9 (test_watchlists_bulk_source_authoring ~2 min). Replaying
    # the same 76 runs with each job's own setup: console-p0-gate median 11.6
    # / max 13.9 min, this job median 5.2 / max 6.7. The two runs cancelled
    # at the cap are not in that replay; there the Console P0 steps alone took
    # ~17.5 (a failing run) and ~16.1 min with setup. Not into dreams-tracking:
    # that job already varies 6.2-12.7 min (250 tests since #3108), and these
    # steps would take it to ~18.6. Each step is still its own pytest process,
    # the admission-sensitive one after the sandboxed one (TASK-32873).
    #
    # TASK-40724: run 43487945840 reached 91% of the final group at 20min.
    # Use the existing long-lane budget; per-test deadlines stay unchanged.
    name: Dreams and Guardian boundary contracts
    if: needs.preflight.outputs.full == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.release || inputs.pr != '' || github.ref != 'refs/heads/dev')))
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Same line as pr-fast-lane, on purpose (see ui-fast-lane's note).
      - name: Install fast-lane dependencies
        run: python -m pip install -e . pytest pytest-asyncio pytest-timeout packaging aiohttp-jinja2

      # PR2921: bounded privacy, native recovery and actual dispatch contracts.
      # TASK-36532: this step also hosts Tests/Chat/test_local_server_discovery.py
      # (sandboxed; 962 nodes, 5 min 43 s serial locally at load 36-39 on
      # 2026-11-16, TASK-41131) because pr-fast-lane is at its 35-min cap.
      # TASK-38758: and Tests/Backup_Recovery/test_guarded_raw_evidence_reuse.py
      # (sandboxed, ~30 s serial), for the same reason. TASK-38759 adds the
      # vLLM profile file and, FIRST, the history participant lifetimes file:
      # its pauses drain every live lease in the process. TASK-38986 closed
      # the five Guardian leaks that made that order necessary, and
      # --storage-lease-guard fails any test here that leaves a new live lease.
      # TASK-38966 appends the QwenCloud provider contract file (pure, ~2 s
      # serial), red on dev in no lane. TASK-39043 (owner decision 2026-11-06:
      # only its two small files here) appends the Console sync maintenance
      # file and the automatic wake recovery file.
      - name: Run Dreams and Guardian boundary contracts
        if: ${{ !cancelled() }}
        run: |
          pytest \
            Tests/Backup_Recovery/test_async_file_participant_lifetimes.py \
            Tests/Dreams/test_dispatch_currentness.py \
