name: TASK-22512 Windows collection evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-collection:
    name: Windows collection only
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out exact evidence commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collection dependencies
        run: python -m pip install pytest pytest-asyncio pytest-timeout psutil loguru

      - name: Collect POSIX backend tests on Windows
        run: |
          set +e
          python -m pytest Tests/Terminal/test_posix_backend.py --collect-only -q 2>&1 | tee windows-collection.log
          pytest_status=${PIPESTATUS[0]}
          set -e
          test "$pytest_status" -eq 5
          grep -Fq "SKIPPED [1]" windows-collection.log
          grep -Fq "POSIX PTY backend requires POSIX" windows-collection.log
          grep -Fq "no tests collected" windows-collection.log
