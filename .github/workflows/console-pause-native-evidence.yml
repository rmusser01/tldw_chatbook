name: PR3023 bounded Windows quit diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-four:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      # Intentionally unrunnable until the distinct reviews and binding seal.
      VIDEO_FOUR_BINDING_SHA256: 'd6fa580dadcb2c0cb0effc9e821af154c7904e99857c3d3aa8ac99d6eae2c00d'
    steps:
      - name: Set LF checkout policy before checkout and create failure archive
        shell: pwsh
        run: |
          $output = Join-Path $env:USERPROFILE ('.config/cb-video-four-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '-r1')
          New-Item -ItemType Directory -Path $output -ErrorAction Stop | Out-Null
          "VIDEO_FOUR_OUTPUT=$output" >> $env:GITHUB_ENV
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Could not set checkout LF policy' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Could not set checkout LF policy' }
          @{ scope = 'Ordinary isolated hosted runner; LF BEFORE checkout, no source normalization after byte-guard failure'; run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT; sha = $env:GITHUB_SHA; shell_pid = $PID } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $output 'workflow-start.json')
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Verify permanent snapshot and extract exact packet outside checkout
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = $env:VIDEO_FOUR_OUTPUT
          $archive = Join-Path $output 'run'
          $owned = Join-Path $env:GITHUB_WORKSPACE '.github/qualification/pr3023-video-quit-diagnostic-r1'
          python (Join-Path $owned 'outer.py.txt') initialize --checkout $env:GITHUB_WORKSPACE --archive $archive --binding (Join-Path $owned 'binding.json') --binding-sha256 $env:VIDEO_FOUR_BINDING_SHA256 *> (Join-Path $output 'initialize.log')
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot/packet initialization refused; inspect initialize.log' }
      - name: Install existing dev dependencies and exact test versions
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = $env:VIDEO_FOUR_OUTPUT
          python -m pip install -e ".[dev]" pytest==8.4.2 textual==8.2.8 pytest-asyncio==1.2.0 *> (Join-Path $output 'install.log')
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed; inspect install.log' }
      - name: Select ordinary current-profile fixture temporary root
        shell: pwsh
        run: |
          $fixture = Join-Path $env:USERPROFILE ('.config/pr3023-video-quit-diagnostic-r1-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $fixture -ErrorAction Stop | Out-Null
          "TEMP=$fixture" >> $env:GITHUB_ENV
          "TMP=$fixture" >> $env:GITHUB_ENV
      - name: Run original quit diagnostic with read-only final audit
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = $env:VIDEO_FOUR_OUTPUT
          $archive = Join-Path $output 'run'
          $outer = Join-Path $archive 'outer.py'
          $owned = Join-Path $env:GITHUB_WORKSPACE '.github/qualification/pr3023-video-quit-diagnostic-r1'
          $publishedOuter = Join-Path $owned 'outer.py.txt'
          $binding = Join-Path $owned 'binding.json'
          $executionCode = 1
          $auditCode = 1
          try {
            python $outer run --checkout $env:GITHUB_WORKSPACE --archive $archive *> (Join-Path $output 'outer.log')
            $executionCode = $LASTEXITCODE
          } finally {
            python $publishedOuter audit --checkout $env:GITHUB_WORKSPACE --archive $archive --binding $binding --binding-sha256 $env:VIDEO_FOUR_BINDING_SHA256 *> (Join-Path $output 'shell-final-audit.log')
            $auditCode = $LASTEXITCODE
            @{ shell_pid = $PID; foreground_outer_exit = $executionCode; read_only_audit_exit = $auditCode; scope = 'Foreground wait plus actual Python-owned direct-child Popen wait/poll receipts. Source remains permanent and unchanged; no PID adoption, rollback, POSIX ECHILD or hard-cancellation guarantee' } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $output 'shell-finally.json')
          }
          if ($executionCode -ne 0 -or $auditCode -ne 0) { throw "Windows Video4 execution or audit requires review: outer=$executionCode audit=$auditCode" }
      - name: Read-only final audit and archive manifest including early failure
        if: always()
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = $env:VIDEO_FOUR_OUTPUT
          $archive = Join-Path $output 'run'
          $owned = Join-Path $env:GITHUB_WORKSPACE '.github/qualification/pr3023-video-quit-diagnostic-r1'
          $publishedOuter = Join-Path $owned 'outer.py.txt'
          $binding = Join-Path $owned 'binding.json'
          $auditCode = 1
          if ((Test-Path $publishedOuter) -and (Test-Path $binding)) {
            python $publishedOuter audit --checkout $env:GITHUB_WORKSPACE --archive $archive --binding $binding --binding-sha256 $env:VIDEO_FOUR_BINDING_SHA256 *> (Join-Path $output 'always-final-audit.log')
            $auditCode = $LASTEXITCODE
          }
          python -c "import hashlib,json,os; from pathlib import Path; p=Path(os.environ['VIDEO_FOUR_OUTPUT']); rows=[{'path':f.relative_to(p).as_posix(),'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in sorted(p.rglob('*')) if f.is_file() and f!=p/'workflow-artifacts.json']; (p/'workflow-artifacts.json').write_text(json.dumps({'files':rows,'scope':'All extant output files including hidden files; manifest excludes itself'},indent=2)+'\n',encoding='utf-8')"
          if ($LASTEXITCODE -ne 0 -or $auditCode -ne 0) { throw 'Final audit incomplete or refused; preserve all available artifacts' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr3023-video-quit-diagnostic-r1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.VIDEO_FOUR_OUTPUT }}/
          include-hidden-files: true
          if-no-files-found: error
