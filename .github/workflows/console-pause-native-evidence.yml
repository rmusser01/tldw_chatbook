name: PR3023 OPT36 OPT74 native baseline qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-prerequisites:
    name: Metadata qualification (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Record exact original source before dependency installation
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          baseline = "2716b844e1320355476942000e29e0534b2d7b4c"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["GITHUB_SHA"]
          assert subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip() == baseline
          names = subprocess.check_output(["git", "diff", "--name-only", baseline, "HEAD"], text=True).splitlines()
          assert names == ['.github/workflows/console-pause-native-evidence.yml', 'Tests/Backup_Recovery/test_windows_metadata_baseline_opt36_opt74.py', 'Tests/Backup_Recovery/test_windows_metadata_prerequisites.py', 'Tests/Utils/test_windows_security_decode.py', 'backlog/decisions/126-complete-local-backup-and-recovery.md', 'tldw_chatbook/Utils/windows_files.py']
          paths = subprocess.check_output(["git", "ls-files", "tldw_chatbook", "Tests", "pyproject.toml", "setup.cfg", "setup.py"], text=True).splitlines()
          hashes = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths}
          receipt = {"baseline": baseline, "head": head, "changed_paths": names, "source_sha256": hashes, "runner_os": os.environ["RUNNER_OS"], "scope": "native baseline only; no optimization product or policy acceptance"}
          Path(os.environ["RUNNER_TEMP"], "pr3023-opt36-opt74-baseline-r5-source.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
      - name: Install original dependencies
        run: python -m pip install -e ".[dev]"
      - name: Record required native API definitions
        shell: python
        run: |
          import json, os
          from pathlib import Path
          from tldw_chatbook.Utils import windows_files
          cls = windows_files.WindowsOS
          methods = {name: name in vars(cls) for name in ("stat_for_admission", "stat_many_for_admission")}
          receipt = {"head": os.environ["GITHUB_SHA"], "methods": methods, "retained_close_exception": "_AdmissionMetadataCloseError" in vars(windows_files), "scope": "definition capability only; native implementations not called"}
          Path(os.environ["RUNNER_TEMP"], "pr3023-opt36-opt74-baseline-r5-capability.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          assert all(methods.values()) and receipt["retained_close_exception"]
      - name: Select ordinary Windows fixture temporary root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baselineTemp = Join-Path $env:USERPROFILE '.config/pr3023-opt36-opt74-baseline-r5-temp'
          New-Item -ItemType Directory -Path $baselineTemp -Force | Out-Null
          "TEMP=$baselineTemp" >> $env:GITHUB_ENV
          "TMP=$baselineTemp" >> $env:GITHUB_ENV
      - name: Run qualified metadata controls and reviewed OPT36 OPT74 baseline tests
        run: >-
          python -m Tests.windows_private_fixture_runner
          Tests/Utils/test_windows_files.py
          Tests/Utils/test_windows_security_decode.py
          Tests/DB/test_private_sqlite_windows_descriptor.py
          Tests/Backup_Recovery/test_windows_metadata_prerequisites.py
          Tests/Backup_Recovery/test_windows_metadata_baseline_opt36_opt74.py
          -q --timeout=180
          --junitxml=${{ runner.temp }}/pr3023-opt36-opt74-baseline-r5.xml
      - name: Verify original source remained unchanged
        if: always()
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          receipt_path = Path(os.environ["RUNNER_TEMP"], "pr3023-opt36-opt74-baseline-r5-source.json")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          drift = [path for path, digest in receipt["source_sha256"].items() if not Path(path).is_file() or hashlib.sha256(Path(path).read_bytes()).hexdigest() != digest]
          receipt["source_drift"] = drift
          receipt_path.write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          assert not drift, drift
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr3023-opt36-opt74-baseline-r5-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/pr3023-opt36-opt74-baseline-r5-source.json
            ${{ runner.temp }}/pr3023-opt36-opt74-baseline-r5-capability.json
            ${{ runner.temp }}/pr3023-opt36-opt74-baseline-r5.xml
          if-no-files-found: error
