permissions:
  contents: read

jobs:
  windows-custody:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.10', '3.13', '3.14']
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      TLDW_REQUIRE_ELEVATED_CUSTODY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Verify fixture launcher restores the original elevated owner
        env:
          TLDW_REQUIRE_ELEVATED_CUSTODY: '0'
        run: python -m pytest Tests/Utils/test_windows_private_fixture_runner.py -q --timeout=120
      - name: Verify actual elevated token ownership and fresh NTFS admission
        run: python -m pytest Tests/Utils/test_windows_custody_requirement.py Tests/Utils/test_windows_native_admission.py Tests/Backup_Recovery/test_windows_admission_evidence.py Tests/Backup_Recovery/test_bootstrap_creation_intents.py -q -s --timeout=180 --junitxml=${{ runner.temp }}/windows-admission.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-custody-${{ matrix.python }}
          path: ${{ runner.temp }}/windows-admission.xml
          if-no-files-found: error
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install bounded-probe dependencies
        id: install
        run: python -m pip install -e ".[dev]"
      - name: Select a user-owned Windows temporary root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pauseTemp = Join-Path $env:USERPROFILE '.config/console-pause-native-temp'
          New-Item -ItemType Directory -Path $pauseTemp -Force | Out-Null
          "TEMP=$pauseTemp" >> $env:GITHUB_ENV
          "TMP=$pauseTemp" >> $env:GITHUB_ENV
      - name: Verify original browser and annotation native callback lifetimes
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m Tests.windows_private_fixture_runner Tests/UI/test_console_browser_worker_native_lifetime.py Tests/UI/test_console_annotation_preview_native_lifetime.py -q --timeout=300 --junitxml=${{ runner.temp }}/query-lifetimes.xml
      - name: Verify Workspace run-log cleanup and declared query freshness
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m Tests.windows_private_fixture_runner Tests/Backup_Recovery/test_finite_workspace_workers.py Tests/Backup_Recovery/test_console_subagent_query_custody.py Tests/UI/test_console_agent_controller.py::test_drilldown_row_click_retargets_the_full_log_to_that_run "Tests/MCP/test_external_catalog_worker_ownership.py::test_accepted_catalog_retains_producer_and_native_custody[False]" -q --timeout=240 --junitxml=${{ runner.temp }}/workspace-query-lifetimes.xml
      - name: Verify shared admission, refresh, scheduler and captured trace controls
        run: python -m Tests.windows_private_fixture_runner Tests/Utils/test_windows_private_fixture_runner.py Tests/test_private_profile_failure_report.py Tests/UI/test_console_shared_context_policy.py Tests/Backup_Recovery/test_mcp_source_metadata_repetition.py Tests/Backup_Recovery/test_nested_repository_check_repetition.py Tests/Backup_Recovery/test_controller_finite_db_interval.py Tests/Backup_Recovery/test_controller_agent_source_intervals.py Tests/Backup_Recovery/test_console_settings_worker_lifetime.py Tests/Chat/test_console_async_mcp_snapshot.py Tests/Chat/test_console_snapshot_first_import.py Tests/Chat/test_console_local_review_hook.py Tests/Tools/test_workspace_root_native_identity.py Tests/Tools/test_workspace_root_pin.py Tests/Tools/test_worker_import_closure.py Tests/MCP/test_console_snapshot_source_contracts.py Tests/UI/test_character_context_async_ownership.py Tests/UI/test_console_character_context.py Tests/UI/test_console_agent_controller.py Tests/UI/test_console_native_send_pump.py Tests/UI/test_console_command_origin_chat.py Tests/UI/test_console_video_send_freeze.py Tests/Console/test_console_command_draft.py Tests/UI/test_home_console_resume.py Tests/UI/test_console_shutdown_recompose.py Tests/UI/test_chat_screen_resume_handoff_registration.py Tests/Chat/test_console_generation_actions.py::test_generate_image_handler_restores_draft_when_batch_raises Tests/UI/test_console_hook_refresh_lifetime.py Tests/Chat/test_console_hook_admission.py Tests/UI/test_console_hook_review_send_freeze.py Tests/UI/test_console_checked_display_scope.py Tests/Backup_Recovery/test_startup_initializing_publication.py Tests/Backup_Recovery/test_visual_identity_observation_budget.py Tests/Backup_Recovery/test_repository_coordinator_io.py Tests/Backup_Recovery/test_storage_coordinator_native_io.py Tests/Backup_Recovery/test_storage_scope_publication.py Tests/Backup_Recovery/test_related_path_admission.py Tests/Backup_Recovery/test_startup_readmission_continuity.py Tests/Backup_Recovery/test_console_presentation_cadence.py Tests/Backup_Recovery/test_console_live_empty_fleet.py Tests/MCP/test_external_catalog_worker_ownership.py Tests/Backup_Recovery/test_admission_evidence_reuse.py Tests/Backup_Recovery/test_console_metadata_batching.py Tests/Backup_Recovery/test_generation_witness_observation.py Tests/Backup_Recovery/test_bootstrap_creation_intents.py Tests/Backup_Recovery/test_bootstrap_directory_durability.py Tests/Backup_Recovery/test_bootstrap_creation_intent_evidence.py Tests/Backup_Recovery/test_raw_source_coordinator_io.py Tests/Backup_Recovery/test_restored_mcp_continuous_custody.py Tests/Backup_Recovery/test_mcp_source_lifetimes.py::test_permission_rmw_admitted_before_pause_finishes Tests/Backup_Recovery/test_mcp_source_lifetimes.py::test_same_path_distinct_source_cannot_borrow_admitted_permission Tests/Backup_Recovery/test_mcp_source_lifetimes.py::test_installed_retarget_refuses_and_custom_subclass_stays_unqualified Tests/Backup_Recovery/test_mcp_source_lifetimes.py::test_config_retarget_and_native_demotion_refuse_bound_source Tests/Backup_Recovery/test_finite_db_counted_interval.py Tests/Backup_Recovery/test_console_config_sync_lifetime.py Tests/Chat/test_console_context_presentation_reads.py Tests/Chat/test_console_retry_json_identity.py Tests/Chat/test_console_retry_json_wire.py Tests/Chat/test_console_engine_trace_reconstruction.py Tests/UI/test_console_settings_context_owner.py Tests/Chat/test_console_trace_admission_gc.py Tests/Chat/test_console_trace_graph_gc.py Tests/UI/test_console_refresh_read_batching.py Tests/UI/test_console_readiness_config_projection.py Tests/UI/test_console_partial_mount_resize.py Tests/UI/test_console_recovery_height_idempotence.py Tests/Scheduling/test_scheduler_stop_resolution.py Tests/App/test_subscription_boot_admission_thread.py Tests/LLM_Calls/test_documented_provider_response_contracts.py Tests/Agents/test_mcp_catalog_store_offload.py Tests/Agents/test_console_scoped_run_log_admission.py Tests/Backup_Recovery/test_sensitive_input_config_bundle.py -q --timeout=180 --junitxml=${{ runner.temp }}/console-controls.xml
      - name: Verify finite callback repairs with actual platform resources
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m Tests.windows_private_fixture_runner Tests/Backup_Recovery/test_binding_root_tree_observation.py Tests/Backup_Recovery/test_binding_root_tree_refusals.py Tests/Chat/test_console_hook_workspace_lifetime.py Tests/Backup_Recovery/test_character_refresh_finite_batch.py Tests/Backup_Recovery/test_character_refresh_batch_source_controls.py Tests/Backup_Recovery/test_character_refresh_batch_entry_controls.py Tests/UI/test_console_workspace_availability_cancellation_lifetime.py Tests/Performance/test_probe_trace_retirement.py Tests/Chat/test_workspace_cold_composite_work_count.py Tests/Chat/test_workspace_composite_fences.py Tests/Chat/test_workspace_composite_gap_faults.py Tests/Agents/test_stock_nested_agent_admission.py Tests/Performance/test_console_cold_receipt_native_initialization.py Tests/Performance/test_console_initial_receipt_await.py -q --timeout=240 --junitxml=${{ runner.temp }}/finite-callback-controls.xml
      - name: Verify original mounted Windows restore and live-scheduler boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Windows' }}
        run: python -m Tests.windows_private_fixture_runner "Tests/Backup_Recovery/test_startup_pending_readmission.py::test_parent_readmission_waits_for_actual_isolated_finalization[success]" "Tests/Backup_Recovery/test_startup_pending_readmission.py::test_parent_readmission_waits_for_actual_isolated_finalization[pending_failure]" "Tests/Backup_Recovery/test_startup_pending_readmission.py::test_initial_pending_fence_waits_for_live_scheduler_and_native_pause[success]" -q --timeout=180 --junitxml=${{ runner.temp }}/mounted-restores.xml
      - name: Measure real guarded Console and three immediate captured replies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TLDW_PAUSE_PROBE_RESULT: ${{ runner.temp }}/console-pause.json
        run: python -m Tests.windows_private_fixture_runner Tests/Performance/test_console_native_pause_probe.py -q --timeout=900 --junitxml=${{ runner.temp }}/console-pause.xml
      - name: Retain native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-pause-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/console-pause.json
            ${{ runner.temp }}/console-pause.xml
            ${{ runner.temp }}/console-controls.xml
            ${{ runner.temp }}/finite-callback-controls.xml
            ${{ runner.temp }}/query-lifetimes.xml
            ${{ runner.temp }}/workspace-query-lifetimes.xml
            ${{ runner.temp }}/mounted-restores.xml
          if-no-files-found: error
  trace-settlement-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
      PYTEST_PLUGINS: Tests.Performance.console_trace_settlement_witness
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install original probe dependencies
        run: python -m pip install -e ".[dev]"
      - name: Observe original Ubuntu terminal settlement (diagnostic only)
        run: python -m Tests.Performance.run_trace_settlement_diagnostic --output-base ${{ runner.temp }}/trace-settlement-diagnostic
      - name: Retain diagnostic exception and ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-settlement-diagnostic-ubuntu
          path: |
            ${{ runner.temp }}/trace-settlement-diagnostic.json
            ${{ runner.temp }}/trace-settlement-diagnostic.xml
            ${{ runner.temp }}/trace-settlement-diagnostic.source.json
            ${{ runner.temp }}/trace-settlement-diagnostic.log
          if-no-files-found: error

  supplemental-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install targeted control dependencies
        run: python -m pip install -e ".[dev]"
      - name: Select a user-owned Windows temporary root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $supplementalTemp = Join-Path $env:USERPROFILE '.config/console-supplemental-native-temp'
          New-Item -ItemType Directory -Path $supplementalTemp -Force | Out-Null
          "TEMP=$supplementalTemp" >> $env:GITHUB_ENV
          "TMP=$supplementalTemp" >> $env:GITHUB_ENV
      - name: Verify source, codec, display and finite worker regressions
        env:
          TLDW_HIDDEN_READINESS_RESULT: ${{ runner.temp }}/hidden-readiness.json
        run: python -m Tests.windows_private_fixture_runner Tests/Backup_Recovery/test_sensitive_input_config_bundle.py Tests/Backup_Recovery/test_sensitive_input_body_bindings.py Tests/Backup_Recovery/test_sensitive_input_tuple_bindings.py Tests/Backup_Recovery/test_sensitive_input_guarded_body_bindings.py Tests/Agents/test_console_scoped_run_log_admission.py Tests/Agents/test_scoped_run_log_body_bindings.py Tests/Config/test_windows_argv_roundtrip.py Tests/Utils/test_toml_serialization.py Tests/UI/test_provider_context_display.py Tests/UI/test_provider_context_display_controls.py Tests/UI/test_console_session_sync_lifetime.py Tests/UI/test_console_session_pruning_replacement.py Tests/UI/test_console_session_tab_strip.py Tests/UI/test_console_session_tab_close.py Tests/Backup_Recovery/test_prepared_close_runtime_owner.py Tests/UI/test_manual_unread_worker_lifetime.py Tests/UI/test_manual_unread_source_provenance.py Tests/UI/test_console_hidden_readiness_native.py Tests/UI/test_console_readiness_scheduling.py Tests/Performance/test_trace_settlement_diagnostic.py -q --timeout=180 --junitxml=${{ runner.temp }}/supplemental-controls.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-supplemental-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/supplemental-controls.xml
            ${{ runner.temp }}/hidden-readiness.json
          if-no-files-found: error
  remote-bundle-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Install the actual floor first; keep 3.12 as the app interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install original bundle control dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify actual floor is available before original tests
        run: python3.10 --version
      - name: Verify exact regeneration, bare execution and real 3.10 parsing
        run: python -m Tests.windows_private_fixture_runner Tests/Tools/test_remote_worker_bundle.py Tests/Tools/test_worker_import_closure.py -q --timeout=180 --junitxml=${{ runner.temp }}/remote-bundle-controls.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-bundle-controls-ubuntu
          path: ${{ runner.temp }}/remote-bundle-controls.xml
          if-no-files-found: error

  startup-cohort-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install original control dependencies
        run: python -m pip install -e ".[dev]"
      - name: Observe original control prefix through catalog False (diagnostic only)
        run: python -m Tests.Performance.run_startup_cohort_diagnostic --output-base ${{ runner.temp }}/startup-cohort-diagnostic
      - name: Retain original exception and startup cohort evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-cohort-diagnostic-ubuntu
          path: |
            ${{ runner.temp }}/startup-cohort-diagnostic.witness.json
            ${{ runner.temp }}/startup-cohort-diagnostic.xml
            ${{ runner.temp }}/startup-cohort-diagnostic.source.json
            ${{ runner.temp }}/startup-cohort-diagnostic.log
          if-no-files-found: error

  startup-liveness:
    name: Complete startup liveness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install original startup dependencies
        run: python -m pip install -e ".[dev]"
      - name: Select ordinary Windows startup temporary root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $startupTemp = Join-Path $env:USERPROFILE '.config/console-startup-native-temp'
          New-Item -ItemType Directory -Path $startupTemp -Force | Out-Null
          "TEMP=$startupTemp" >> $env:GITHUB_ENV
          "TMP=$startupTemp" >> $env:GITHUB_ENV
      - name: Qualify source-current startup helper/process route without App
        id: startup_sources
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $startupPython = (Get-Command python).Source
          $startupRoot = Join-Path $env:RUNNER_TEMP 'console-startup-source-qualification'
          & $startupPython -I -X utf8 Tests/Performance/qualify_console_startup_liveness_sources.py --repo $env:GITHUB_WORKSPACE --python $startupPython --receipt-root $startupRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure complete cold and fresh-process warm startup liveness
        if: ${{ !cancelled() && steps.startup_sources.outcome == 'success' }}
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $startupPython = (Get-Command python).Source
          $startupPairBase = $env:RUNNER_TEMP
          if ($env:RUNNER_OS -eq 'Windows') { $startupPairBase = $env:TEMP }
          $startupPair = Join-Path $startupPairBase 'console-startup-private-pair'
          $startupReceipts = Join-Path $env:RUNNER_TEMP 'console-startup-liveness'
          $startupHead = git rev-parse HEAD
          & $startupPython -I -X utf8 Tests/Performance/run_console_startup_liveness.py --repo $env:GITHUB_WORKSPACE --python $startupPython --pair-root $startupPair --receipt-root $startupReceipts --mode liveness --expected-commit $startupHead
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify passive startup timing and diagnostic mode controls
        id: startup_timing_controls
        if: ${{ !cancelled() && steps.startup_sources.outcome == 'success' }}
        shell: pwsh
        run: |
          python -I -X utf8 -m unittest discover -s Tests/Performance -p test_console_startup_timing_witness.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -X utf8 -m unittest discover -s Tests/Performance -p test_console_startup_timing_mode.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose original startup bodies with separate cold and warm profiles
        if: ${{ !cancelled() && steps.startup_sources.outcome == 'success' && steps.startup_timing_controls.outcome == 'success' }}
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $startupPython = (Get-Command python).Source
          $startupPairBase = $env:RUNNER_TEMP
          if ($env:RUNNER_OS -eq 'Windows') { $startupPairBase = $env:TEMP }
          $startupPair = Join-Path $startupPairBase 'console-startup-timing-private-pair'
          $startupReceipts = Join-Path $env:RUNNER_TEMP 'console-startup-timing'
          $startupHead = git rev-parse HEAD
          & $startupPython -I -X utf8 Tests/Performance/run_console_startup_liveness.py --repo $env:GITHUB_WORKSPACE --python $startupPython --pair-root $startupPair --receipt-root $startupReceipts --mode timing --expected-commit $startupHead
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain original startup liveness/source receipts on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-startup-liveness-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/console-startup-source-qualification
            ${{ runner.temp }}/console-startup-liveness
            ${{ runner.temp }}/console-startup-timing
          if-no-files-found: error
