permissions:
  contents: read

jobs:
  preparing-poll:
    name: Manual Preparing polling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -e ".[dev]"
      - name: Select a user-owned Windows temporary root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pollTemp = Join-Path $env:USERPROFILE '.config/preparing-poll-temp'
          New-Item -ItemType Directory -Path $pollTemp -Force | Out-Null
          "TEMP=$pollTemp" >> $env:GITHUB_ENV
          "TMP=$pollTemp" >> $env:GITHUB_ENV
      - name: Verify original polling, current actions and source escalation
        run: >-
          python -m Tests.windows_private_fixture_runner
          Tests/UI/test_console_poll_reconciliation.py
          Tests/UI/test_console_poll_cadence.py
          Tests/UI/test_console_context_publication_routing.py
          Tests/UI/test_console_poll_tab_source_boundaries.py
          Tests/Backup_Recovery/test_console_config_sync_lifetime.py::test_full_console_sync_defers_live_state_until_fresh_config_entry
          -q --timeout=180 --junitxml=${{ runner.temp }}/preparing-poll.xml
      - name: Verify question routing and ordinary Send feedback
        if: ${{ !cancelled() }}
        run: >-
          python -m Tests.windows_private_fixture_runner
          Tests/UI/test_console_ask_user_typed_answers.py
          Tests/UI/test_console_native_chat_flow.py::test_console_successful_send_does_not_leave_empty_send_tooltip
          -q --timeout=180 --junitxml=${{ runner.temp }}/send-question-routing.xml
      - name: Verify Send hook sharing and original native read lifetime
        if: ${{ !cancelled() }}
        run: >-
          python -m Tests.windows_private_fixture_runner
          Tests/Chat/test_console_send_hook_read_sharing.py
          Tests/Chat/test_console_hook_preparation_lifetime.py
          -q --timeout=180 --junitxml=${{ runner.temp }}/send-hook-lifetime.xml
      - name: Verify fresh local capability manifest and independent results
        if: ${{ !cancelled() }}
        run: >-
          python -m Tests.windows_private_fixture_runner
          Tests/MCP/test_local_manifest_snapshot.py
          Tests/MCP/test_local_control_service.py::test_local_manifest_helper_stays_aligned_with_registered_server_surface
          Tests/MCP/test_local_control_service.py::test_local_control_service_builds_inventory_from_local_manifest_without_loopback
          Tests/MCP/test_library_tools.py::test_manifest_library_entries_do_not_alias_descriptor_schemas
          -q --timeout=180 --junitxml=${{ runner.temp }}/local-manifest.xml
      - name: Verify composition ceilings and fresh invocation boundaries
        if: ${{ !cancelled() }}
        run: >-
          python -m Tests.windows_private_fixture_runner
          Tests/MCP/test_console_tool_preparation.py
          Tests/MCP/test_console_preparation_constructors.py
          Tests/Chat/test_console_shared_tool_preparation.py
          Tests/Chat/test_console_composition_tool_ceiling.py
          Tests/Agents/test_mcp_tool_provider.py
          Tests/MCP/test_console_snapshot_source_contracts.py::test_empty_mcp_maximum_preserves_plugin_route
          -q --timeout=180 --junitxml=${{ runner.temp }}/builtin-only-preparation.xml
      - name: Publish failed test identifiers and report completeness
        if: always()
        run: >-
          python -m Tests.junit_result_summary
          "${{ runner.temp }}/preparing-poll.xml"
          "${{ runner.temp }}/send-question-routing.xml"
          "${{ runner.temp }}/send-hook-lifetime.xml"
          "${{ runner.temp }}/local-manifest.xml"
          "${{ runner.temp }}/builtin-only-preparation.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preparing-poll-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/preparing-poll.xml
            ${{ runner.temp }}/send-hook-lifetime.xml
            ${{ runner.temp }}/send-question-routing.xml
            ${{ runner.temp }}/local-manifest.xml
            ${{ runner.temp }}/builtin-only-preparation.xml
          if-no-files-found: error
  raw-pin-evidence:
    name: Raw pin evidence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -e ".[dev]"
      - name: Select a user-owned Windows temporary root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pinTemp = Join-Path $env:USERPROFILE '.config/raw-pin-evidence-temp'
          New-Item -ItemType Directory -Path $pinTemp -Force | Out-Null
          "TEMP=$pinTemp" >> $env:GITHUB_ENV
          "TMP=$pinTemp" >> $env:GITHUB_ENV
      - name: Verify derived-evidence eligibility and original native ownership
        run: >-
          python -m Tests.windows_private_fixture_runner
          Tests/Backup_Recovery/test_raw_file_single_flush.py
          Tests/Backup_Recovery/test_async_file_participant_lifetimes.py::test_raw_publication_flushes_the_file_and_the_parent_directory
          Tests/Backup_Recovery/test_settings_file_participant_lifetimes.py::test_published_bytes_are_fsynced_before_the_rename
          Tests/Backup_Recovery/test_settings_file_participant_lifetimes.py::test_failed_canonical_file_flush_retains_uncertain_custody
          Tests/Backup_Recovery/test_compound_chat_source_lifetimes.py::test_dictionary_history_publication_flushes_its_own_bytes
          Tests/Backup_Recovery/test_raw_pin_evidence_eligibility.py
          Tests/Backup_Recovery/test_windows_admission_evidence.py
          Tests/Backup_Recovery/test_acquisition_single_path_fence.py
          Tests/Backup_Recovery/test_windows_evidence_watch.py
          Tests/Backup_Recovery/test_windows_evidence_watch_final_gate.py
          Tests/Backup_Recovery/test_windows_snapshot_metadata_work.py
          Tests/Utils/test_windows_security_decode.py
          Tests/DB/test_journal_mode_statement_retention.py
          Tests/Backup_Recovery/test_guarded_raw_evidence_reuse.py::test_warm_raw_operation_owns_and_retires_actual_parent_fd
          Tests/Backup_Recovery/test_guarded_raw_evidence_reuse.py::test_wrong_warm_parent_fd_is_closed_before_original_fallback
          Tests/Backup_Recovery/test_guarded_raw_evidence_reuse.py::test_parent_swap_during_open_has_the_same_original_refusal
          Tests/Backup_Recovery/test_guarded_raw_evidence_reuse.py::test_reuse_stamp_io_never_runs_under_coordinator_lock
          Tests/Backup_Recovery/test_guarded_raw_evidence_reuse.py::test_warm_descriptor_uncertainty_and_publication_keep_original_custody
          -q --timeout=180 --junitxml=${{ runner.temp }}/raw-pin-evidence.xml
      - name: Publish failed test identifiers and report completeness
        if: always()
        run: >-
          python -m Tests.junit_result_summary
          "${{ runner.temp }}/raw-pin-evidence.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-pin-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/raw-pin-evidence.xml
          if-no-files-found: error
  windows-custody:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.10', '3.13', '3.14']
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      TLDW_REQUIRE_ELEVATED_CUSTODY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Verify fixture launcher restores the original elevated owner
        env:
          TLDW_REQUIRE_ELEVATED_CUSTODY: '0'
        run: python -m pytest Tests/Utils/test_windows_private_fixture_runner.py -q --timeout=120
      - name: Verify actual elevated token ownership and fresh NTFS admission
        run: python -m pytest Tests/Utils/test_windows_custody_requirement.py Tests/Utils/test_windows_native_admission.py Tests/Backup_Recovery/test_windows_admission_evidence.py Tests/Backup_Recovery/test_bootstrap_creation_intents.py -q -s --timeout=180 --junitxml=${{ runner.temp }}/windows-admission.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-custody-${{ matrix.python }}
          path: ${{ runner.temp }}/windows-admission.xml
          if-no-files-found: error
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install bounded-probe dependencies
        id: install
        run: python -m pip install -e ".[dev]"
      - name: Select a user-owned Windows temporary root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pauseTemp = Join-Path $env:USERPROFILE '.config/console-pause-native-temp'
          New-Item -ItemType Directory -Path $pauseTemp -Force | Out-Null
          "TEMP=$pauseTemp" >> $env:GITHUB_ENV
          "TMP=$pauseTemp" >> $env:GITHUB_ENV
      - name: Verify trace maintenance and optional Hook-host shutdown
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m Tests.windows_private_fixture_runner Tests/Chat/test_console_trace_maintenance_lifetime.py Tests/Chat/test_console_trace_maintenance_parking.py Tests/Chat/test_console_initial_hook_review.py Tests/Chat/test_console_cold_trust_preparation.py -q --timeout=180 --junitxml=${{ runner.temp }}/trace-maintenance-lifetimes.xml
      - name: Retain focused maintenance evidence before longer controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: trace-maintenance-${{ matrix.os }}
          path: ${{ runner.temp }}/trace-maintenance-lifetimes.xml
          if-no-files-found: error
      - name: Verify Change Review marker query scope and unchanged rendering
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m Tests.windows_private_fixture_runner Tests/Chat/test_console_change_review_marker_reads.py Tests/UI/test_console_marker_projection_native.py Tests/Chat/test_change_turn_tracking.py::test_resume_re_derives_the_summary_row_byte_identical -q --timeout=180 --junitxml=${{ runner.temp }}/change-review-marker-reads.xml
      - name: Retain focused marker query evidence before longer controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: change-review-marker-reads-${{ matrix.os }}
          path: ${{ runner.temp }}/change-review-marker-reads.xml
          if-no-files-found: error
      - name: Verify attention callback native cleanup and existing behavior
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m Tests.windows_private_fixture_runner Tests/Chat/test_console_attention_native_lifetime.py Tests/UI/test_console_turn_attention.py -q --timeout=180 --junitxml=${{ runner.temp }}/attention-lifetimes.xml
      - name: Retain attention lifetime evidence before longer controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: attention-lifetimes-${{ matrix.os }}
          path: ${{ runner.temp }}/attention-lifetimes.xml
          if-no-files-found: error
      - name: Verify retained Character picker native lifetime and profile selection
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m Tests.windows_private_fixture_runner Tests/UI/test_console_character_picker_native_lifetime.py Tests/UI/test_character_context_async_ownership.py::test_start_keeps_exact_profile_through_picker_fetch -q --timeout=180 --junitxml=${{ runner.temp }}/character-picker-lifetimes.xml
      - name: Retain focused Character picker evidence before longer controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: character-picker-lifetimes-${{ matrix.os }}
          path: ${{ runner.temp }}/character-picker-lifetimes.xml
          if-no-files-found: error
      - name: Verify original browser and annotation native callback lifetimes
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m Tests.windows_private_fixture_runner Tests/UI/test_console_browser_worker_native_lifetime.py Tests/UI/test_console_annotation_preview_native_lifetime.py -q --timeout=300 --junitxml=${{ runner.temp }}/query-lifetimes.xml
      - name: Verify cold workspace provisioning on the actual platform
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
