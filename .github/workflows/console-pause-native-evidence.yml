name: PR3023 original shutdown registry qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-prerequisites:
    name: Shutdown registry qualification (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Record exact original source before dependency installation
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          baseline = "2716b844e1320355476942000e29e0534b2d7b4c"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["GITHUB_SHA"]
          assert subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip() == baseline
          names = subprocess.check_output(["git", "diff", "--name-only", baseline, "HEAD"], text=True).splitlines()
          assert names == ['.github/workflows/console-pause-native-evidence.yml', 'Tests/Performance/test_app_shutdown_process_collection.py', 'tldw_chatbook/app_lifecycle.py']
          paths = subprocess.check_output(["git", "ls-files", "tldw_chatbook", "Tests", "pyproject.toml", "setup.cfg", "setup.py"], text=True).splitlines()
          hashes = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths}
          receipt = {"baseline": baseline, "head": head, "changed_paths": names, "source_sha256": hashes, "runner_os": os.environ["RUNNER_OS"], "scope": "Original six shutdown controls only; no app launch or whole shutdown acceptance"}
          Path(os.environ["RUNNER_TEMP"], "pr3023-shutdown-registry-r1-source.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
      - name: Install original dependencies
        run: python -m pip install -e ".[dev]"
      - name: Record actual supported registry before controls
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          receipt = {"head": os.environ["GITHUB_SHA"], "runner_os": os.environ["RUNNER_OS"], "actual_registry_is_none": subprocess._active is None, "scope": "actual CPython registry only; no process launch or shutdown call"}
          Path(os.environ["RUNNER_TEMP"], "pr3023-shutdown-registry-r1-capability.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          assert receipt["actual_registry_is_none"]
      - name: Select ordinary Windows fixture temporary root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baselineTemp = Join-Path $env:USERPROFILE '.config/pr3023-shutdown-registry-r1-temp'
          New-Item -ItemType Directory -Path $baselineTemp -Force | Out-Null
          "TEMP=$baselineTemp" >> $env:GITHUB_ENV
          "TMP=$baselineTemp" >> $env:GITHUB_ENV
      - name: Run original finite shutdown registry controls
        run: >-
          python -m Tests.windows_private_fixture_runner
          Tests/Performance/test_app_shutdown_process_collection.py
          -q --timeout=180
          --junitxml=${{ runner.temp }}/pr3023-shutdown-registry-r1.xml
      - name: Verify original source remained unchanged
        if: always()
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          receipt_path = Path(os.environ["RUNNER_TEMP"], "pr3023-shutdown-registry-r1-source.json")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          drift = [path for path, digest in receipt["source_sha256"].items() if not Path(path).is_file() or hashlib.sha256(Path(path).read_bytes()).hexdigest() != digest]
          receipt["source_drift"] = drift
          receipt_path.write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          assert not drift, drift
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr3023-shutdown-registry-r1-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/pr3023-shutdown-registry-r1-source.json
            ${{ runner.temp }}/pr3023-shutdown-registry-r1-capability.json
            ${{ runner.temp }}/pr3023-shutdown-registry-r1.xml
          if-no-files-found: error
