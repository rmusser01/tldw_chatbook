        run: python -m Tests.windows_private_fixture_runner Tests/Tools/test_remote_worker_bundle.py Tests/Tools/test_worker_import_closure.py -q --timeout=180 --junitxml=${{ runner.temp }}/remote-bundle-controls.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-bundle-controls-ubuntu
          path: ${{ runner.temp }}/remote-bundle-controls.xml
          if-no-files-found: error

  startup-cohort-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install original control dependencies
        run: python -m pip install -e ".[dev]"
      - name: Observe original control prefix through catalog False (diagnostic only)
        run: python -m Tests.Performance.run_startup_cohort_diagnostic --output-base ${{ runner.temp }}/startup-cohort-diagnostic
      - name: Retain original exception and startup cohort evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-cohort-diagnostic-ubuntu
          path: |
            ${{ runner.temp }}/startup-cohort-diagnostic.witness.json
            ${{ runner.temp }}/startup-cohort-diagnostic.xml
            ${{ runner.temp }}/startup-cohort-diagnostic.source.json
            ${{ runner.temp }}/startup-cohort-diagnostic.log
          if-no-files-found: error

  startup-liveness:
    name: Complete startup liveness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install original startup dependencies
        run: python -m pip install -e ".[dev]"
      - name: Select ordinary Windows startup temporary root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $startupTemp = Join-Path $env:USERPROFILE '.config/console-startup-native-temp'
          New-Item -ItemType Directory -Path $startupTemp -Force | Out-Null
          "TEMP=$startupTemp" >> $env:GITHUB_ENV
          "TMP=$startupTemp" >> $env:GITHUB_ENV
      - name: Qualify source-current startup helper/process route without App
        id: startup_sources
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $startupPython = (Get-Command python).Source
          $startupRoot = Join-Path $env:RUNNER_TEMP 'console-startup-source-qualification'
          & $startupPython -I -X utf8 Tests/Performance/qualify_console_startup_liveness_sources.py --repo $env:GITHUB_WORKSPACE --python $startupPython --receipt-root $startupRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure complete cold and fresh-process warm startup liveness
        if: ${{ !cancelled() && steps.startup_sources.outcome == 'success' }}
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $startupPython = (Get-Command python).Source
          $startupPairBase = $env:RUNNER_TEMP
          if ($env:RUNNER_OS -eq 'Windows') { $startupPairBase = $env:TEMP }
          $startupPair = Join-Path $startupPairBase 'console-startup-private-pair'
          $startupReceipts = Join-Path $env:RUNNER_TEMP 'console-startup-liveness'
          $startupHead = git rev-parse HEAD
          & $startupPython -I -X utf8 Tests/Performance/run_console_startup_liveness.py --repo $env:GITHUB_WORKSPACE --python $startupPython --pair-root $startupPair --receipt-root $startupReceipts --mode liveness --expected-commit $startupHead
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify passive startup timing and diagnostic mode controls
        id: startup_timing_controls
        if: ${{ !cancelled() && steps.startup_sources.outcome == 'success' }}
        shell: pwsh
        run: |
          python -I -X utf8 -m unittest discover -s Tests/Performance -p test_console_startup_timing_witness.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -X utf8 -m unittest discover -s Tests/Performance -p test_console_startup_timing_mode.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose original startup bodies with separate cold and warm profiles
        if: ${{ !cancelled() && steps.startup_sources.outcome == 'success' && steps.startup_timing_controls.outcome == 'success' }}
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $startupPython = (Get-Command python).Source
          $startupPairBase = $env:RUNNER_TEMP
          if ($env:RUNNER_OS -eq 'Windows') { $startupPairBase = $env:TEMP }
          $startupPair = Join-Path $startupPairBase 'console-startup-timing-private-pair'
          $startupReceipts = Join-Path $env:RUNNER_TEMP 'console-startup-timing'
          $startupHead = git rev-parse HEAD
          & $startupPython -I -X utf8 Tests/Performance/run_console_startup_liveness.py --repo $env:GITHUB_WORKSPACE --python $startupPython --pair-root $startupPair --receipt-root $startupReceipts --mode timing --expected-commit $startupHead
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain original startup liveness/source receipts on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-startup-liveness-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/console-startup-source-qualification
            ${{ runner.temp }}/console-startup-liveness
            ${{ runner.temp }}/console-startup-timing
          if-no-files-found: error
