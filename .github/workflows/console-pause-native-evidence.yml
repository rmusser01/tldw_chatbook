name: PR3023 current native prerequisite baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-current-controls:
    name: Original current controls (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Record exact original source before dependency installation
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          baseline = "5c78baaa2bd86d1edff0d85eff165390b6f7bffd"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["GITHUB_SHA"]
          assert subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip() == baseline
          names = subprocess.check_output(["git", "diff", "--name-only", baseline, "HEAD"], text=True).splitlines()
          assert names == [".github/workflows/console-pause-native-evidence.yml"]
          paths = subprocess.check_output(["git", "ls-files", "tldw_chatbook", "Tests", "pyproject.toml", "setup.cfg", "setup.py"], text=True).splitlines()
          hashes = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths}
          receipt = {"baseline": baseline, "head": head, "changed_paths": names, "source_sha256": hashes, "runner_os": os.environ["RUNNER_OS"], "scope": "original-current controls; no source metadata/reuse/elevated optimization qualification"}
          Path(os.environ["RUNNER_TEMP"], "pr3023-native-baseline-source.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
      - name: Install original dependencies
        run: python -m pip install -e ".[dev]"
      - name: Select ordinary Windows fixture temporary root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baselineTemp = Join-Path $env:USERPROFILE '.config/pr3023-native-baseline-temp'
          New-Item -ItemType Directory -Path $baselineTemp -Force | Out-Null
          "TEMP=$baselineTemp" >> $env:GITHUB_ENV
          "TMP=$baselineTemp" >> $env:GITHUB_ENV
      - name: Run unchanged current native and fallback controls
        run: >-
          python -m Tests.windows_private_fixture_runner
          Tests/Utils/test_windows_files.py
          Tests/Utils/test_windows_security_decode.py
          Tests/DB/test_private_sqlite_windows_descriptor.py
          Tests/Backup_Recovery/test_admission_evidence_reuse.py
          -q --timeout=180
          --junitxml=${{ runner.temp }}/pr3023-native-baseline.xml
      - name: Verify original source remained unchanged
        if: always()
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          receipt_path = Path(os.environ["RUNNER_TEMP"], "pr3023-native-baseline-source.json")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          drift = [path for path, digest in receipt["source_sha256"].items() if not Path(path).is_file() or hashlib.sha256(Path(path).read_bytes()).hexdigest() != digest]
          receipt["source_drift"] = drift
          receipt_path.write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          assert not drift, drift
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr3023-native-baseline-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/pr3023-native-baseline-source.json
            ${{ runner.temp }}/pr3023-native-baseline.xml
          if-no-files-found: error
