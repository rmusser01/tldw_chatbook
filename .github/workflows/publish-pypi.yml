name: Publish Python package

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    uses: ./.github/workflows/test.yml

  build:
    uses: ./.github/workflows/package-check.yml

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && github.ref_protected
    needs: [build, qualify]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/tldw-chatbook/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  check_pypi_release:
    name: Check PyPI release status
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, qualify]
    runs-on: ubuntu-latest
    outputs:
      release_exists: ${{ steps.check.outputs.release_exists }}
      latest_version: ${{ steps.check.outputs.latest_version }}
      publish_release: ${{ steps.check.outputs.publish_release }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install output path validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install loguru packaging psutil pydantic

      - name: Check whether version should be published to PyPI
        id: check
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          # `python Packaging/check_pypi_release.py` puts Packaging/ (not the
          # repo root) at sys.path[0], and the job never installs the package,
          # so the script's `from tldw_chatbook.Utils...` import needs the repo
          # root on PYTHONPATH. Broke main's first two publish runs on
          # 2026-09-04; hotfixed there as 943a0ef1f4 — this is that same line,
          # backported so the dev→main merge hunk resolves without losing it.
          PYTHONPATH: ${{ github.workspace }}
        run: python Packaging/check_pypi_release.py "$RELEASE_VERSION"

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && needs.check_pypi_release.outputs.publish_release == 'true'
    needs: [build, qualify, check_pypi_release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tldw-chatbook/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
