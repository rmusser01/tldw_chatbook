# Example configuration for Profile-Based RAG Service
# Add these settings to your ~/.config/tldw_cli/config.toml

[rag_search]
# ... existing RAG settings ...

[rag_search.service]
# Select a configuration profile
profile = "hybrid_basic"  # Default profile

# Available profiles:
# - "bm25_only" - Pure keyword/BM25 search (fastest)
# - "vector_only" - Pure semantic/vector search
# - "hybrid_basic" - Combined search without enhancements (default)
# - "hybrid_enhanced" - Hybrid with parent document retrieval
# - "hybrid_full" - All features enabled for maximum accuracy
#
# Specialized profiles:
# - "fast_search" - Optimized for speed
# - "high_accuracy" - Maximum retrieval accuracy
# - "balanced" - Balance between speed and accuracy
# - "long_context" - For documents requiring extended context
# - "technical_docs" - Technical documentation with tables/code
# - "research_papers" - Academic papers with citations
# - "code_search" - Code repository search

# Optional: Override specific settings from the profile
[rag_search.service.custom_overrides]
# enable_parent_retrieval = true
# enable_reranking = true
# enable_parallel_processing = true
# parent_size_multiplier = 3
#
# There is NO "reranking_strategy" key. One was listed here and it read
# nothing -- setting it selected nothing at all (TASK-17600 F3). The
# strategy belongs to a RAG PROFILE: `reranking_config.strategy` in the
# profile's saved JSON under <user data dir>/rag_profiles/, which survives
# a restart because the profile serialises and rebuilds the whole
# RerankingConfig. Clone a built-in profile, set it there.
#
# Reranking strategies: "pointwise" | "pairwise" | "listwise" bill an LLM
# provider per call; "cross_encoder" runs a local model (no provider, no
# credential, no network). "cross_encoder" is selectable but NOT
# recommended -- it is the only strategy anyone has measured on the gated
# eval instrument (TASK-16965) and it came out net HARMFUL on the averaged
# row (semantic MRR 0.808 -> 0.762, hybrid 0.812 -> 0.787), while producing
# large gains on the weak-retrieval categories (hybrid "scoped" MRR
# 0.163 -> 0.929). Numbers: Docs/superpowers/qa/2026-08-17-cross-encoder/report.md

# Example configurations:

# For pure keyword search (no embeddings)
# [rag_search.service]
# profile = "bm25_only"

# For semantic search only
# [rag_search.service]
# profile = "vector_only"

# For maximum accuracy with all features
# [rag_search.service]
# profile = "hybrid_full"

# For technical documentation
# [rag_search.service]
# profile = "technical_docs"

# For custom configuration based on a profile
# [rag_search.service]
# profile = "hybrid_enhanced"
# [rag_search.service.custom_overrides]
# enable_reranking = true
# (the strategy is a profile field -- see the note above; there is no
#  reranking_strategy key, and "llm" was never one of the four values)