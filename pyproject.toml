
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tldw_chatbook"
version = "0.1.8.0"
authors = [
  { name="Robert Musser", email="contact@rmusser.net" },
]
description = "A Textual TUI for chatting with LLMs, and interacting with the tldw server."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["tui", "cli", "llm", "textual", "ai", "chat", "rag", "embeddings", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Topic :: Utilities",
    "Topic :: Terminals",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Typing :: Typed",
]

# --- Dependencies ---
dependencies = [
    "chardet",
    "httpx",
    "loguru",
    "textual==8.2.8",  # exact pin: UI framework, bump deliberately (TASK-1353)
    "textual-diff-view==0.1.5",  # exact pin: diff widget, bump deliberately (TASK-1351)
    "requests",
    "rich",
    "wcwidth>=0.2.14,<1",
    "rich-pixels>=3.0.0",
    # TASK-18606: was pinned to ==11.2.1 for ADR-054 renderer identity. The
    # renderer now owns its own determinism (fixed-cell font pinned and metric-
    # verified, identity hashed from pixels not PNG bytes), so the identity no
    # longer rides on this version. Freezing an image PARSER that this app
    # points at untrusted input was too high a price for reproducibility that
    # belongs in the renderer. Floor is 10.4, which introduced
    # `ImageFont.load_default_imagefont()` (10.1 is what changed
    # `load_default()` to the proportional TrueType face -- the very break
    # this renderer pins its way out of -- but the explicit legacy-font
    # accessor the renderer needs did not exist until 10.4).
    "pillow>=10.4",
    "PyYAML",
    "pydantic>=2.4,<3",
    "portalocker==3.2.0",
    "psutil",
    "toml",
    "tomli; python_version < '3.11'",
    "pyperclip",
    "emoji",
    "jinja2",
    "pycryptodomex",
    "keyring",
    "markdownify",
    "aiofiles",
    "croniter>=1.4.0",
    "textual-image",
    "tiktoken",      # engine tokens strategy (Q2: hard-required, shim-enforced)
    "defusedxml",    # engine xml security parsing (Q9: core)
]

# --- Optional Dependencies ---
[project.optional-dependencies]
coding_map = [
    "grep_ast",
    "pygments",
    "tqdm",

]
chunker = [
    "langdetect",
    "nltk",
    "scikit-learn",
    "fugashi",
    "transformers",
    "tqdm",
    "jieba",
]
embeddings_rag = [
    "torch",
    "numpy",
    "pydantic",
    "transformers",
    "chromadb>=0.4.0",
    "sentence-transformers",
    "opentelemetry-api",
    "opentelemetry-sdk",
]
websearch = [
    "lxml",
    "beautifulsoup4",
    "pandas",
    "playwright",
    #"playwright_stealth",
    "trafilatura",
    "langdetect",
    "nltk",
    "scikit-learn",
    "aiohttp",
    "defusedxml",
    "tqdm",
]
local_vllm = ["vllm"]
local_mlx = ["mlx-lm"]
# Individual transcription providers
transcription_faster_whisper = [
    "faster-whisper",  # CPU/CUDA optimized Whisper
]
transcription_parakeet_onnx = [
    "onnx-asr[cpu]==0.12.0",  # Cross-platform Parakeet ONNX runtime
]
transcription_transcribe_cpp = [
    "transcribe-cpp==0.1.3",  # Optional direct-local GGUF runtime
]
transcription_lightning_whisper = [
    "lightning-whisper-mlx; sys_platform == 'darwin'",  # Fast Whisper for Apple Silicon
]
transcription_parakeet = [
    "onnx-asr[cpu]==0.12.0",  # Cross-platform Parakeet ONNX runtime
]
# Legacy alias for backward compatibility
mlx_whisper = [
    "lightning-whisper-mlx; sys_platform == 'darwin'",  # Fast Whisper for Apple Silicon
    "parakeet-mlx; sys_platform == 'darwin'",  # Real-time ASR for Apple Silicon
]
local_transformers = ["transformers"]
mcp = [
    "mcp-unified==0.2.1",
]
image_generation = [
    # SwarmUI API client (Media_Creation/swarmui_client.py). aiohttp previously
    # shipped only in [websearch] -- for the article scraper -- so wanting image
    # generation meant installing the web-search stack (playwright, trafilatura,
    # pandas, nltk, scikit-learn, ...) to obtain one HTTP client (task-1262).
    "aiohttp",
]
video_playback = [
    # In-app video playback (task-3401.9/.10): PyAV decodes frames for the
    # in-transcript silent preview; textual-canvas backs the full player
    # screen's scrubber. Both are optional -- surfaces degrade to guidance
    # (or the OS player) when absent, and video generation never needs them.
    "av",
    "textual-canvas",
]
svg = [
    "cairosvg",  # SVG rasterization for image attachments; needs the cairo C library (e.g. `brew install cairo`)
]
frontmatter = [
    # YAML front matter consumed (not rendered as noise) in note/README
    # markdown previews (TASK-1993); absence falls back to default parsing.
    "mdit-py-plugins",
]
pdf = [
    "pymupdf",
    "pymupdf4llm",
    "docling",
]
ebook = [
    "ebooklib",
    "beautifulsoup4",
    "lxml",
    "html2text",
    "markdownify",
    "defusedxml",
]
audio = [
    "soundfile",
    "scipy",
    "yt-dlp",
    "numpy",
    "pydub",
    "audioop-lts; python_version >= '3.13'",  # stdlib audioop removed in 3.13; pydub needs it
