media_processing = [
    "soundfile",
    "scipy",
    "yt-dlp",
    "numpy",
    "faster-whisper",  # Default transcription provider
    "onnx-asr[cpu]==0.12.0",  # Cross-platform Parakeet ONNX batch runtime
