[project.urls]
"Homepage" = "https://github.com/rmusser01/tldw_chatbook"
"Bug Tracker" = "https://github.com/rmusser01/tldw_chatbook/issues"
"Documentation" = "https://github.com/rmusser01/tldw_chatbook#readme"
"Source Code" = "https://github.com/rmusser01/tldw_chatbook"
"Changelog" = "https://github.com/rmusser01/tldw_chatbook/blob/main/CHANGELOG.md"

# This creates a command-line script called 'tldw-chatbook'
[project.scripts]
# Loads the full app only when the command is invoked.
tldw-cli = "tldw_chatbook.cli:main_cli_runner"
# Direct web server entry point
tldw-serve = "tldw_chatbook.Web_Server.serve:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]  # Look for packages in the current directory (where pyproject.toml is)
# Include the 'tldw_chatbook' package and its submodules
include = ["tldw_chatbook*"]
exclude = [
    "Tests*",
    ".venv*",
]

[tool.setuptools.package-data]
# Bundle only the reviewed Samira character and Visual Identity pack inventory.
"tldw_chatbook" = [
    "assets/characters/samira/*.json",
    "assets/characters/samira/*.png",
    "assets/characters/samira/*.md",
    "assets/characters/samira/expressions/*.webp",
]
# Include all .tcss files in css directory and subdirectories
"tldw_chatbook.css" = ["*.tcss", "**/*.tcss"]
# Include theme files
"tldw_chatbook.css.Themes" = ["*.tcss"]
# Include JSON configuration, guides, and the RAG pipeline defaults.
# `rag_pipelines.toml` stays a literal ON PURPOSE (audited in task-19860): a
# `*.toml` glob would also ship `embedding_configs_examples.toml`, which
# `Packaging/check_manifest.py` forbids in the wheel. Adding a *runtime*
# `.toml` here means adding its name here too.
"tldw_chatbook.Config_Files" = ["*.json", "*.md", "rag_pipelines.toml"]
# Runtime chunking templates are DB rows now (spec §8.1.2): the deleted
# Chunking/templates/ file store ships in neither artifact.
# `eval_datasets/*.json` is RUNTIME data, not a sample: `Evals/eval_templates/
# research.py` hands its absolute path to the runner as `dataset_name`, and
# `eval_runner.py` does `Path(dataset_name).exists()` -- absent from the
# artifact, the bundled "Research Report Self-Eval" template silently loses its
# dataset. Found by the task-19860 reviewer sweep for runtime reads of non-.py
# assets; it was the second instance of the same defect class.
"tldw_chatbook.Evals" = ["config/*.yaml", "eval_datasets/*.json"]
"tldw_chatbook.Image_Generation" = ["workflows/*.json"]
"tldw_chatbook.Video_Generation" = ["workflows/*.json"]
# One pinned artifact manifest, named ON PURPOSE (audited in task-19860):
# `Tests/Packaging` pins its repository, commit and package count, so a second
# TTS `.json` appearing in the wheel is a decision, not a glob's side effect.
"tldw_chatbook.TTS" = ["audio_cpp_artifact_manifest.json"]
# Every migration script, matched -- never enumerated (task-19860). The
# hand-written list this replaced held 13 of the 32 files that existed;
# `chachanotes_v40_to_v41_persona_visual.sql` and
# `chachanotes_v45_to_v46_sync_log_retention.sql` are both read by
# `_initialize_schema`'s v4->current chain, so a PyPI install died with a
# SchemaError before the app could start. A new migration must ship the
# moment it lands, and only the author of the migration knows it exists;
# `*.sql` is the only rule that cannot go stale. README.md stays out: the
# wheel forbids development Markdown.
"tldw_chatbook.DB" = ["migrations/*.sql"]
# Preserve the licenses for vendored packages. Named ON PURPOSE (audited in
# task-19860): a licence notice is a fixed legal obligation per vendored
# package, not a growing asset directory. The obligation is what makes the
# list's COMPLETENESS load-bearing -- `LLM_Calls/` and `tldw_api/` re-license
# their own modules under Apache-2.0 (see the README in each), those modules
# ship in the wheel, and §4(a) requires the licence text to travel with them;
# both were missing until the task-19860 reviewer diffed the tree against the
# artifact.
"tldw_chatbook.Third_Party.aider" = ["LICENSE.txt"]
"tldw_chatbook.Third_Party.textual_fspicker" = ["LICENSE"]
"tldw_chatbook.LLM_Calls" = ["LICENSE"]
"tldw_chatbook.tldw_api" = ["LICENSE"]
# Engine is vendored from tldw_server (GPL-3.0-only): GPLv3 §4 requires the
# licence text itself to ship, so the scope map and the GPL text both travel
# with the package.
"tldw_chatbook.Chunking.engine" = ["LICENSE", "LICENSES/GPL-3.0-only.txt"]
# Include CSS files in subdirectories
"tldw_chatbook.css.core" = ["*.tcss"]
"tldw_chatbook.css.features" = ["*.tcss"]
"tldw_chatbook.css.layout" = ["*.tcss"]
# If you have other assets inside your tldw_chatbook package (e.g., tldw_chatbook/assets/), add them here:
# "tldw_chatbook.assets" = ["*"]

[tool.pytest.ini_options]
# THE single pytest config (task-1457). Tests/UI/pytest.ini used to shadow this
# whenever pytest was invoked as `pytest Tests/UI` (different rootdir, its own
# asyncio mode, NO timeout, root conftest not loaded); every invocation now
# resolves here.
testpaths = ["Tests"]
# Exclude server tests that don't belong in the TUI.
# --durations: always report the slowest tests (>=1s) so wall-clock regressions are visible in every run.
# --strict-markers: an unregistered marker is a collection error, not a silent no-op.
addopts = "--ignore=STests --import-mode=importlib --durations=25 --durations-min=1.0 --strict-markers -ra"
# Auto mode suite-wide: async tests execute without per-function marks. Under
# the old split config, unmarked async tests silently DID NOT RUN in full runs
# from the repo root (pytest-asyncio strict mode skips unmarked coroutines).
asyncio_mode = "auto"
# Default timeout for all tests (in seconds)
timeout = 300
# Timeout method: thread (default) or signal
timeout_method = "thread"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "ui: marks tests as UI/Textual tests",
    "asyncio: marks tests as async",
    "timeout: marks tests with custom timeout values",
    "optional: marks tests that require optional dependencies (skipped unless --run-optional)",
    "performance: marks tests as performance tests",
    "property: marks tests as property-based tests",
    "slow: marks tests that take a long time to run (skipped unless --run-slow)",
    "smoke: fast sanity checks of core imports and wiring",
    "production_path: opts the test into the production sanitization path (Tests/Chunking/conftest.py disables PYTEST_CURRENT_TEST/TLDW_TEST_MODE so the engine's relaxed test-mode branch stays off, spec §10.2)",
    "benchmark: performance-measurement tests (labeling only; pytest-benchmark is not installed)",
    "snapshot: visual regression tests using snapshots",
    "notes: Notes feature tests",
    "requires_display: tests that require a display (may fail in CI)",
    "requires_cleanup: tests that need a gc pass immediately after running",
    "real_audio_device: opts out of the autouse _no_real_audio_device guard (Tests/conftest.py) to exercise a real sounddevice OutputStream",
    "allow_network: opts out of the autouse _no_network_io guard (Tests/conftest.py) to open a real socket; justify it in the test's docstring",
    "loopback_network: permits only numeric IPv4 127.0.0.0/8 and IPv6 ::1 sockets under the autouse _no_network_io guard (Tests/conftest.py)",
    "local_server_probe: opts out of the autouse _no_local_server_probes guard (Tests/conftest.py) to exercise the real /v1/models probe against an injected httpx.MockTransport client",
    "owned_http_client: opts out of the autouse _console_gateway_http_client_is_offline guard (Tests/conftest.py) for tests that are ABOUT the gateway's real owned httpx client",
    "live: marks tests that call real paid external APIs (require key files + TLDW_LIVE_SEARCH_TESTS=1 + --run-live)",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
follow_imports = "skip"
disable_error_code = ["annotation-unchecked"]
exclude = [
    "tldw_chatbook/Local_Ingestion/API_Endpoint_Sample.py",
]
