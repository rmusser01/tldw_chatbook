local_tts = [
    "kokoro-onnx",
    "scipy",
    "numpy",
    "nltk",
    "pyaudio",
    "pydub",
    "audioop-lts; python_version >= '3.13'",  # stdlib audioop removed in 3.13; pydub needs it
    "transformers",  # For tokenization
    "torch",  # For PyTorch-based models
    "onnxruntime",  # For ONNX models
    "av",  # pyav for audio format conversion
