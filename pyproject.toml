    #   pip install -e .
    #   cd ..
    #
    # Step 2: Install tldw_chatbook with Higgs support:
    #   pip install -e ".[higgs_tts]"
    #
    # The following are supporting dependencies for Higgs Audio:
    "torch",  # PyTorch for model inference
    "torchaudio",  # For audio processing and voice cloning
    "numpy",  # For audio data manipulation
    "scipy",  # For audio signal processing
    "librosa",  # For advanced audio feature extraction
    "soundfile",  # For audio file I/O
    "transformers",  # For tokenization and text processing
]
nemo = [
    "nemo-toolkit[asr]>=1.20.0",  # For NVIDIA Parakeet and Canary models
    "torch",  # Required by NeMo
    "torchaudio",  # Required for audio processing
]
speech_recording = [
    "pyaudio>=0.2.14",  # Primary audio backend
    "sounddevice>=0.4.6",  # Fallback audio backend
    "webrtcvad-wheels>=2.0.14",  # Voice activity detection (drop-in `webrtcvad` fork; upstream webrtcvad 2.0.10 imports pkg_resources, which setuptools>=81 removed)
]
realtime = [
    "websockets>=14.0",  # Transport for the realtime voice engine (LLM_Calls/realtime); imported lazily by transport/session modules, never at package-import time. Floor is 14.0, NOT 12: `transport.py` calls `connect(additional_headers=...)`, which only the asyncio client accepts, and 14.0 is the release where the top-level `connect` resolves to it -- on 12/13 the legacy client takes `extra_headers` and raises TypeError at connect time
    "sounddevice>=0.4.6",  # Reply-audio output (Audio/streaming_sink.py) AND the realtime mic tap's capture backend -- nothing else a realtime-only install pulls in provides an audio device
    "numpy",  # Required by AudioRecordingService (the mic tap refuses to construct without it) and by the sink's frame handling
]
ocr_docext = [
    "docext",  # NanoNets document extraction toolkit
    "gradio_client",  # For API-based usage
    "transformers>=4.30.0",  # For direct model usage (optional)
    "torch",  # For direct model usage (optional)
    "openai",  # For OpenAI-compatible API usage
    "Pillow",  # For image handling
]
