<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quantity, price, and discount</title>
<style>
body { margin: 0; padding: 16px; font-family: sans-serif; color: #182536; background-color: #ffffff; }
main { max-width: 480px; margin: 0 auto; }
h1 { font-size: 24px; }
p { line-height: 1.5; }
label { display: block; margin: 20px 0 8px; }
input { box-sizing: border-box; width: 100%; padding: 10px; font-size: 18px; border-width: 1px; border-style: solid; border-color: #536579; border-radius: 4px; }
input:focus { outline: 3px solid #245d91; outline-offset: 2px; }
output { font-size: 22px; font-weight: bold; }
.line { margin: 12px 0; }
.discount { color: #1c6b3c; }
</style>
</head>
<body>
<main>
<h1>Estimate a total</h1>
<p>Enter up to 1000 whole units, a unit price from 0 to 10000, and a discount of 0 to 100 percent.</p>
<label for="quantity">Quantity (whole units)</label>
<input id="quantity" type="number" min="0" max="1000" step="1" value="2">
<label for="unit-price">Unit price</label>
<input id="unit-price" type="number" min="0" max="10000" step="0.01" value="12.50">
<label for="discount">Discount (%)</label>
<input id="discount" type="number" min="0" max="100" step="0.01" value="0">
<p class="line">Subtotal: <output id="subtotal" for="quantity unit-price" aria-live="polite">25.00</output></p>
<p class="line discount">Discount: <output id="discount-amount" for="discount" aria-live="polite">0.00</output></p>
<p class="line">Total: <output id="total" for="quantity unit-price discount" aria-live="polite">25.00</output></p>
</main>
<script>
const quantity = document.getElementById("quantity");
const unitPrice = document.getElementById("unit-price");
const discount = document.getElementById("discount");
const subtotal = document.getElementById("subtotal");
const discountAmount = document.getElementById("discount-amount");
const total = document.getElementById("total");
function updateTotal() {
  const count = Number(quantity.value);
  const price = Number(unitPrice.value);
  const rate = Number(discount.value);
  if (quantity.value.trim() === "" || unitPrice.value.trim() === "" ||
      discount.value.trim() === "" ||
      !Number.isFinite(count) || !Number.isFinite(price) || !Number.isFinite(rate) ||
      !Number.isInteger(count) || count < 0 || count > 1000 ||
      price < 0 || price > 10000 ||
      rate < 0 || rate > 100) {
    subtotal.textContent = "Enter values within the stated limits.";
    discountAmount.textContent = "";
    total.textContent = "";
    return;
  }
  const sub = count * price;
  const off = sub * rate / 100;
  subtotal.textContent = sub.toFixed(2);
  discountAmount.textContent = off.toFixed(2);
  total.textContent = (sub - off).toFixed(2);
}
quantity.addEventListener("input", updateTotal);
quantity.addEventListener("change", updateTotal);
unitPrice.addEventListener("input", updateTotal);
unitPrice.addEventListener("change", updateTotal);
discount.addEventListener("input", updateTotal);
discount.addEventListener("change", updateTotal);
updateTotal();
</script>
</body>
</html>
