# Vendored from tldw_server — NEVER hand-edit files listed here (spec §5.2).
# Re-sync: python Helper_Scripts/sync_chunking_engine.py
[upstream]
repo = "https://github.com/rmusser01/tldw_server.git"
branch = "dev"
commit = "385afa951922c8a9dc2002c675bb6cad65e4ac23"

[files]
vendored = [
    "base.py", "chunker.py", "constants.py", "exceptions.py", "error_policy.py",
    "option_utils.py", "regex_safety.py", "security_logger.py",
    "multilingual.py", "llm_context.py",
    "process_text/__init__.py", "process_text/models.py", "process_text/options.py",
    "process_text/preparation.py", "process_text/dispatch.py",
    "process_text/pipeline.py", "process_text/metadata.py",
    "splitters/__init__.py", "splitters/regex.py", "splitters/blingfire.py",
    "strategies/__init__.py", "strategies/words.py", "strategies/sentences.py",
    "strategies/paragraphs.py", "strategies/tokens.py", "strategies/json_xml.py",
    "strategies/ebook_chapters.py", "strategies/ebook_chapters_patch.py",
    "strategies/structure_aware.py", "strategies/code.py", "strategies/code_ast.py",
    "strategies/fixed_size.py", "strategies/semantic.py",
    "strategies/rolling_summarize.py",
    "utils/metrics.py",
]
extra = ["LICENSE", "LICENSES/GPL-3.0-only.txt"]  # scope map + GPLv3 §4 licence text, shipped verbatim
excluded = ["__init__.py", "README.md", "SECURITY.md", "templates.py",
            "template_initialization.py", "template_library/", "auto_planner.py",
            "async_chunker.py", "auto_boundary_assistant.py",
            "strategies/propositions.py", "utils/proposition_eval.py"]

[patches]
# Chatbook-side scripted patches applied by sync_chunking_engine.py after the
# copy+rewrite step (ENGINE_PATCHES, spec §5.2 amendment / task-19321). The
# canonical vendored state is upstream-at-pin + rewrite + these patches; the
# sync's local-modification check compares against that state and fails
# loudly when upstream drifts under a patch anchor. Hand-edits remain
# forbidden — a patch lands here and in ENGINE_PATCHES, nowhere else.
"chunker.py" = "task-19321 / ADR-029: chunk_file_stream diagnostics identify the file by a stable path hash and the exception type instead of the user path / raw exception text"
"strategies/tokens.py" = "task-19322 / ADR-029: the offset-reconstruction fallback records the token piece's length, position and short digest instead of the decoded document text (repair merged in PR #1890, before this table existed)"
"security_logger.py" = "task-19323 / ADR-029: the XXE event store retains the offending XML's length instead of a 500-char sample, and the unredacted export_events() writer is retired"

[licence]
spdx = "GPL-3.0-only"
obligations = "preserve upstream headers; LICENSE + LICENSES/GPL-3.0-only.txt shipped in-subtree (GPLv3 §4); recorded here and in pyproject license-files"
