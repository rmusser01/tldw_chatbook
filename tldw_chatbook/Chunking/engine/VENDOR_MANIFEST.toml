# The descope ledger (2026-08-23 propositions-vendoring spec §4): every
# excluded entry carries its reason; the NOT-VENDORED rulings are permanent
# and mirror into the sync script's TESTS_MODULE_SKIPPED reasons.
# Tests/Chunking/test_descope_ledger.py pins both surfaces.
excluded = [
    "__init__.py",          # upstream's package init: chatbook-authored instead (spec §5.1)
    "README.md", "SECURITY.md",  # upstream docs, not engine code
    "template_initialization.py",  # template init half stays server-side (#2's ruling, spec §13 decision 5)
    "template_library/",    # server-side template storage; chatbook ships template_validation parity
    # NOT VENDORED — descope ruling (spec §4.1): auto_boundary_assistant
    # imports the server's provider stack (AuthNZ llm_provider_overrides +
    # providerCredentialRuntime, Chat bounded_daemon + chat_helpers,
    # LLM_Calls adapter_registry, api.v1.schemas at function level) —
    # server-stack shims with no chatbook consumer; the capability is
    # covered by #3's auto-selection and #4's agent surface. Revisit only
    # if a consumer appears — as a fresh decision against this cost record.
    # The #1 §0 drift obligation for this file closes as moot.
    "auto_boundary_assistant.py",
    # NOT VENDORED — descope ruling (spec §4.2): async_chunker requires
    # http_client (RetryPolicy/afetch) + core.exceptions.ValidationError;
    # chatbook chunks in-process and calls no async entry point — no
    # chatbook consumer. Revisit only if a consumer appears. The #1 §0
    # drift obligation for this file closes as moot.
    "async_chunker.py",
    # upstream's proposition-quality eval harness: rides the §4 descope —
    # a server-side test util with no chatbook consumer (its runtime-
    # snapshot suite is likewise unported; see sync_chunking_engine.py)
    "utils/proposition_eval.py",
]

[patches]
# Chatbook-side scripted patches applied by sync_chunking_engine.py after the
# copy+rewrite step (ENGINE_PATCHES, spec §5.2 amendment / task-19321). The
# canonical vendored state is upstream-at-pin + rewrite + these patches; the
# sync's local-modification check compares against that state and fails
# loudly when upstream drifts under a patch anchor. Hand-edits remain
# forbidden — a patch lands here and in ENGINE_PATCHES, nowhere else.
"chunker.py" = "task-19321 / ADR-029: chunk_file_stream diagnostics identify the file by a stable path hash and the exception type instead of the user path / raw exception text"
"strategies/tokens.py" = "task-19322 / ADR-029: the offset-reconstruction fallback records the token piece's length, position and short digest instead of the decoded document text (repair merged in PR #1890, before this table existed)"
"security_logger.py" = "task-19323 / ADR-029: the XXE event store retains the offending XML's length instead of a 500-char sample, and the unredacted export_events() writer is retired"

[licence]
