# ===========================================================================
# FAIL-FIRST CLASSES (P2ab) — admitted on MEASURED failure, not on intent
# ===========================================================================
#
# Everything above this line was authored to SUCCEED in a chosen mode. After
# the fusion-weighting arc that stopped being useful: hybrid recall sat at
# 1.000 on every scored query, so the instrument could detect a regression
# and nothing else. The fixtures below invert the criterion. A candidate was
# ADMITTED only when today's pipeline was measured to fail it — the target
# missing the top-10 in BOTH vector-bearing modes (hybrid and semantic), with
# its keyword rank recorded beside it. Failure is the admission ticket.
#
# Every admitted fixture carries a `# admitted: <date> hybrid=.. semantic=..
# plain=..` line, which is the probe's own output
# (`harness/fixture_probe.py`, `admission_comment`). A fixture without one
# was not probed, and an unprobed fixture is an assumption.
#
# WHAT WAS PROBED AND NOT ADMITTED (2026-08-10, corpus of 172 documents, k=10
# — the measurement, kept because a class that cannot be made to fail is a
# result, not a gap in this file):
#
#   compositional  6 candidates, 0 admitted. Queries stating a conjunction
#                  ("the supplier OF the coupling THAT let go on the north
#                  run") whose answer document holds both halves in different
#                  sentences, with decoys holding each half squarely. Hybrid
#                  ranks: 1, 1, 1, 1, 2, 2. Diluting the anchor did not move
#                  it (four more "north run" documents left the answer at
#                  rank 2, behind its own single-conjunct decoy). A document
#                  containing both halves is simply the nearest neighbour of
#                  a query naming both.
#   acronym        6 candidates, 0 admitted. Bare acronym in the query, the
#                  expansion spelled out in the target and the letters
#                  nowhere in it (plus the reverse direction, and decoys
#                  using the letters in another sense). Hybrid ranks: 1, 1,
#                  1, 2, 2, 4. MiniLM bridges MTBF/PPE/BOM/RTO/UPS to their
#                  expansions unaided; the one anchor that was deliberately
#                  diluted (four more wash-bay documents) moved its target
#                  from rank 1 to rank 4 and no further. On this corpus and
#                  this model, acronym expansion is not a capability gap —
#                  which retires it as a P2c feature premise, the same way
#                  the vocabulary-mismatch collapse retired query expansion.
#   negation       6 candidates, 3 admitted (below). The three rejected ones
#                  (hybrid ranks 4, 6, 7) share a property: their exception
#                  document is ABOUT the queried aspect (a cabinet's cooling,
#                  a vehicle's loading), so it is the nearest neighbour on
#                  topic alone and negation blindness never gets to matter.
#                  The three admitted ones describe the exception without
#                  ever naming the aspect the query negates.
#   precision_
#   pressure       not authored. The class needs many near-relevant decoys
#                  and a crisp relevance boundary between them, and the two
#                  requirements pull against each other: with a dozen
#                  near-duplicates in the corpus, the cell measures where the
#                  label was drawn rather than what retrieval did. Dropped
#                  deliberately (the spec permits it), not overlooked.
#
# The rejected candidates' documents stay in the corpus as distractors. That
# is the point of them now: they are the company each anchor needed.
#
# THE REJECTED CANDIDATES THEMSELVES, so the rulings above can be audited
# without re-authoring them — a verdict whose evidence has to be
# reconstructed is a verdict nobody checks. `semantic` matched `hybrid` on
# every one of these, so one rank column is the whole story; `plain` missed
# all but one, because the keyword path is AND-of-terms and these are
# questions rather than phrases.
#
#   compositional (all 6 rejected; hybrid rank shown)
#     "which supplier provided the coupling that let go on the north run"
#         -> note-wrenfold-north-run-history                         rank 2
#     "who signed off the operator who logged the balance tank overflow"
#         -> note-renshaw-training-record                            rank 2
#     "what material was the gasket in the drive that seized on the mixing line"
#         -> media-mixing-line-strip-report                          rank 1
#     "which vendor made the switchgear that was replaced after the store flood"
#         -> note-store-flood-repairs                                rank 1
#     "who examined the ladder that was condemned at the tower"
#         -> note-tower-ladder-register                              rank 1
#     "which shift found the leak that closed the filling head"
#         -> note-filling-head-leak-log                              rank 1
#
#   acronym (all 6 rejected; hybrid rank shown)
#     "MTBF for the filling head"     -> media-filling-head-reliability  rank 1
#     "PPE store restocking"          -> media-protective-equipment-store rank 1
#     "BOM for the capping turret"    -> note-capping-turret-parts       rank 1
#     "RTO for the settlement ledger" -> note-settlement-ledger-recovery rank 2
#     "uninterruptible power supply runtime at the gate house"
#         -> conv-gatehouse-power                                    rank 2
#     "SOP for the wash bay"          -> note-wash-bay-procedure         rank 4
#         (the deliberately diluted anchor: four extra wash-bay documents
#          moved this one from rank 1 to rank 4 and no further — the
#          evidence that the rank-1s above are bridging rather than anchor
#          artefacts)
#
#   negation (3 of 6 rejected; hybrid rank shown)
#     "which cabinet has no fan tray fitted"
#         -> conv-dunnock-row-cooling                                rank 4
#     "vehicles that are not fitted with a tracker"
#         -> conv-shared-car-agreement                               rank 6
#     "which vehicle in the fleet has no tail lift"
#         -> note-flatbed-loading                                    rank 7
#
#   scoped (1 of 8 rejected; hybrid rank shown)
#     "line marker post" -> note-kelsingham-hedgerow                  rank 10
#         (plain=2 as well, so its conjunction had stopped resolving
#          uniquely in scope — it failed both halves of the rule)

# ---------------------------------------------------------------------------
# scoped (7) — keyword-findable inside the scope, outside the vector top-10
# ---------------------------------------------------------------------------
#
# Each of these runs under a real `EffectiveScope` built from `scope_slugs`
# (100 site documents — the whole P2ab collection, media and notes; a scope
# has no conversations by rule, `rag_scope` spec D5). The target sits INSIDE
# the scope and is resolved uniquely by the keyword path: `plain=1` on every
# one of them, and it is nowhere in the vector leg's top-10 — in a
# 100-document scope the vector leg puts a heritage note or an angling
# description nowhere near a query that reads like works maintenance.
#
# The scope size is load-bearing and was measured: at 32 documents in scope,
# 1 of 8 candidates failed (a top-10 over 32 documents can hardly exclude
# anything); at 80, six did; at 100, seven. A scoped fixture over a small
# scope reports recall 1.000 for a reason that has nothing to do with
# retrieval.
#
# THE FLIP, measured (2026-08-11, TASK-15020/B1). These were authored as the
# before-numbers for scope-aware hybrid: a scope used to divert a hybrid
# profile to the semantic path, so the hybrid column scored what the semantic
# column scored, 0.000. B1 pushed the scope allowlists into the engine's FTS
# sub-legs and deleted the divert, and the keyword path that already finds
# every one of these at rank 1 became reachable from a scoped hybrid search:
#
#     scoped cell, k=10      semantic        plain        hybrid
#     before (2026-08-10)       0.000        1.000         0.000
#     after  (2026-08-11)       0.000        1.000         1.000
#                                                    (MRR 0.163, NDCG 0.348)
#
# The rescued rows arrive late, and NOT all by the same mechanism. Per-fixture
# fusion provenance, read off `metadata["hybrid_fusion"]` on the live rows
# (k=10, alpha=0.7, vector leg over-fetched to 2*k=20):
#
#   fixture                       fts_rank  vector_rank  rank@rrf_k=5  @rrf_k=60
#   sc-pump-chamber-inspection           1         none             9       miss
#   sc-storm-overflow-record             1           12             3          1
#   sc-intake-screen-survey              1         none             9       miss
#   sc-meter-box-key                     1         none             9       miss
#   sc-valve-pit-access                  1           20             4          1
#   sc-sample-point-sign                 1         none             9       miss
#   sc-duty-board-notice                 1         none             9       miss
#                            scoped hybrid recall:      1.000      0.286
#
# FIVE of the seven are FTS-only: absent from the vector leg's pool entirely,
# they score `(1.0 - alpha) * 1/(rrf_k + 1)`. TWO are not — their targets sit
# at vector rank 12 and 20, inside the over-fetched pool though far outside
# the top-10 the admission rule was stated at, so they carry BOTH legs and
# land at rank 1 even at rrf_k=60. Pool-edge caveat: sc-valve-pit-access's
# vector rank 20 is the LAST row of the 2*k pool — a hybrid_pool_multiplier
# of 1 (pool = k = 10) would demote it to FTS-only and change this table;
# re-derive the provenance before trusting it under a different multiplier.
# Any blanket "this class is FTS-only" claim
# is wrong for those two, and the k=60 counterfactual is 0.286, not 0.000.
#
# The float detail matters, because it is what actually orders the list.
# `fusion.reciprocal_rank_fusion` computes `(1.0 - alpha) * fts_rrf`, and
# `1.0 - 0.7` is 0.30000000000000004 — so an FTS-only row scores exactly 0.05
# while the semantic leg's rank 9 scores 0.7 * 1/14 = 0.049999999999999996.
# The paper form (0.3 * 1/6) is bit-identical to the semantic value; the
# shipped form rounds UP and wins STRICTLY, by 6.94e-18. The tie-break
# convention never runs. Measured in the live ladder: rank 9 = 0.05,
# rank 10 = 0.049999999999999996.
#
# Two different fragilities follow, and they are not the same size. INCLUSION
# has a real margin: the FTS-only row at 0.05 displaces the semantic leg's
# rank 10 at 0.7/15 = 0.0467. PLACEMENT at 9 rather than 10 is the 1-ULP win
# above. So recall 1.000 does not hang on a float artefact — but five of the
# seven sit one position from the bottom of the top-10, and a smaller k or
# any change to alpha/rrf_k moves them. These fixtures measure the two P2
# decisions together (B1 routing + TASK-3994's rrf_k), and their cells move
# with the fusion knobs like any other cell.
#
# The per-fixture `# admitted:` lines below are dated records of the probe
# that ADMITTED each fixture, taken before the flip. `hybrid=miss` on those
# lines is history, not a current score.

# admitted: 2026-08-10 hybrid=miss semantic=miss plain=1
