# RAG eval harness — golden query set (60 queries; P1 authored the first 45)
#
# Schema (exact — the loader rejects missing/unknown keys):
#   id              stable query identifier, unique
#   query           the text handed to the retrieval seam verbatim
#   category        "keyword" | "paraphrase" | "vocabulary_mismatch" |
#                   "negative" | "scoped" | "negation" | "prompt"
#   relevant_slugs  corpus slugs (never DB ids — the real writers assign
#                   autoincrement ids per run; ingestion maps slug -> runtime
#                   id). Empty ONLY for `negative`.
#   scope_slugs     corpus slugs the query's retrieval scope allows. ONLY the
#                   `scoped` category may carry it, and every scoped query
#                   must; the runner turns it into the production
#                   `EffectiveScope`.
#
# The last three categories are P2ab's, and they are admitted on a different
# rule from the first four — see the fail-first block near the end of this
# file before adding to them.
#
# Categories are what make a P2 delta legible per capability ("HyDE:
# paraphrase recall +0.12, keyword unchanged"), so a query's category must
# describe how its target has to be *found*, not what it is about:
#   keyword              the query repeats a rare literal token of the target
#   paraphrase           the query states the target's fact in entirely
#                        different words (zero content-word overlap) — a
#                        single shared noun would turn it into a keyword case
#   vocabulary_mismatch  the query uses the common term where the target uses
#                        only the domain term; nothing else is shared either.
#                        These are expected to MISS today — the harness
#                        records that miss so P2's expansion work has a
#                        before-number.
#   negative             topic genuinely absent from the corpus; scored by
#                        results-returned@k (keyword) / top similarity
#                        (semantic, hybrid), never by P/R/MRR/NDCG.

