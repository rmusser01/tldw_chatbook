# ---------------------------------------------------------------------------
# negation (3) — the query excludes what the rest of the corpus asserts
# ---------------------------------------------------------------------------
#
# Eight outstation records state the norm ("the standard mains supply", "the
# surfaced approach road", "the standard three-panel head"); the exception
# document never uses those words at all, because a site that runs on solar
# has no reason to mention a mains supply. So the keyword paths cannot reach
# the target (AND-of-terms fails on the cue word — `plain=miss` on all
# three), and the vector leg returns the documents that assert the norm.
#
# Both halves of that are needed. Delete the norm documents and the query has
# nothing to be wrong about; write the cue word into the exception and the
# keyword path answers it immediately.

# admitted: 2026-08-10 hybrid=miss semantic=miss plain=miss
[[query]]
id = "ng-mains-supply"
query = "which outstation does not take a standard mains supply"
category = "negation"
relevant_slugs = ["note-skellow-isle-supply"]

# admitted: 2026-08-10 hybrid=miss semantic=miss plain=miss
[[query]]
id = "ng-surfaced-approach"
query = "outstations that are not reached by a surfaced approach road"
category = "negation"
relevant_slugs = ["media-cranmere-sands-visits"]

# admitted: 2026-08-10 hybrid=miss semantic=miss plain=miss
[[query]]
id = "ng-three-panel-head"
query = "which mast does not carry a standard three-panel head"
category = "negation"
relevant_slugs = ["note-tarn-foot-mast"]

# ---------------------------------------------------------------------------
# prompt (5) — the keyword leg reaches prompts; these queries do not reach it
# ---------------------------------------------------------------------------
#
# These five are not probe-admitted in the same sense as the classes above.
# Their targets are `source_type = "prompt"` corpus documents, and when they
# were authored (2026-08-10) the harness had no prompts writer, the engine's
# keyword leg had no prompts sub-leg, and prompts had no vector index
# anywhere: recall 0.000 in all three modes, structurally.
#
# TASK-15020/B2 (2026-08-11) shipped the writer and the sub-leg, and the
