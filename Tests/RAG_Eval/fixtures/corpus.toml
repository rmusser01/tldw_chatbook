title = "Larkspur-11 turbine commissioning walkthrough"
content = """
This walkthrough covers the commissioning of the Larkspur-11 turbine from the delivery of the nacelle through to the first hours on grid. It is recorded as a teaching piece for crews who have erected towers but never taken a machine through acceptance. Nothing in it is site specific beyond the anchor detail noted at the end.

Erection began once the foundation had cured to the full figure and the anchor cage had been surveyed for level. A foundation out of level by even a small angle costs far more in yaw wear over the life of a machine than it costs to correct at the outset, so the correction was made with grout rather than accepted with a note. The tower flange was cleaned to bright metal before the first section went up.

Bolt tension in the tower flanges was taken in three passes with a hydraulic tensioner, working diagonally rather than around. Each pass was recorded against bolt identity so that the settling pass has something to be compared against. Bolts are re-checked after the first running hours because a flange always relaxes as the joint beds in, and a joint that has never been re-checked is the usual explanation for a flange that later works loose.

The nacelle was landed in a calm window with two tag lines and a spotter who could see both the crane and the deck. The Larkspur-11 nacelle carries its own lifting frame, which must be removed before the cover panels go back on, and the frame was returned to the ground on the same lift rather than being left aloft. Slings were inspected and logged before and after.

Rotor assembly on the ground is the safer method where space allows, and it was used here. Each blade root was checked for stud protrusion and the studs were tensioned in the pattern the manual gives, not in the pattern that seems obvious. Blade serial numbers were recorded against hub positions because a blade set is matched and must not be mixed between machines.

The pitch system was proved before the rotor ever turned. Each blade was driven to feather and back under its own drive, and the accumulator charge was verified so that a blade can still be feathered with the main supply lost. Emergency feather was then proved from the panel, from the local control, and from the deliberate removal of supply, because a function that has only been proved one way has only been proved for that way.

Yaw was exercised through a full revolution in both directions with the cable loop watched at the top and the bottom. Cable twist counters were zeroed at the neutral position and the untwist function was proved deliberately rather than left for the controller to discover. The yaw brake was checked for even release across all callipers.

Lubrication was the least glamorous part of the Larkspur-11 commissioning and the part most often rushed. Every automatic lubricator was primed until fresh grease showed at the labyrinth, the reservoirs were filled to their marks, and the delivery lines were traced end to end against the schematic. One line had been run to the wrong point at the factory and would have starved a bearing indefinitely had it not been traced.

The drive train was aligned cold and then checked again after a thermal soak at part load. Alignment that is only ever taken cold ignores the growth that occurs as the machine warms, and it is that hot figure the couplings actually live with. The flexible element was inspected for even loading once the hot figure had been recorded.

Electrical commissioning took the converter through its own routine before the machine was allowed to make torque. Insulation figures were taken on the generator windings and recorded as the reference for future comparison, since an absolute number means little without a first value to trend from. Earthing continuity was proved from the nacelle back to the earth mat.

First rotation was made with the rotor locked out and the drive train barred by hand to confirm nothing fouled. The lock was then released and the rotor allowed to turn in a light wind with the brake modulated, while a crew member watched for contact at every guard and shroud. Two shrouds were adjusted at that stage.

Grid connection followed a witnessed protection test in which each trip was injected and the breaker watched. Overspeed was proved by lowering the setting temporarily rather than by driving the machine fast, which is the safe method and gives the same evidence. Every temporary setting change was recorded on the front sheet and restored under a second signature.

The Larkspur-11 completed its acceptance hours without an unplanned stop, and vibration on the drive train settled below the alarm band once the bearings had bedded. Remaining items are the settling pass on the tower bolts and a permanent guard for the untwist limit, neither of which prevents running. The anchor detail noted at the outset should be carried into any machine erected on the same foundation design.
"""

[[doc]]
slug = "conv-drayton-conveyor"
source_type = "conversation"
title = "Chat: Drayton-6 conveyor belt tracking thread"
content = """
Ops opened the thread asking why the Drayton-6 conveyor keeps running its belt off to the drive side, since two shifts had spent time on it and neither correction held for long. Maintenance answered that a belt which walks the same way every time is almost never a belt fault. The thread that followed is worth keeping because it ended with the actual cause rather than another adjustment.

The first suggestion was to crank the take-up on the drive side, which is what both shifts had already done. Maintenance pushed back on that immediately, pointing out that skewing the take-up steers the belt but also cocks the pulley, and that the fix therefore trades a tracking problem for a bearing problem. A belt that has been steered straight by a cocked pulley runs true and quietly destroys the bearing over months.

Somebody asked for the actual method rather than a warning. Maintenance gave it in order: check the structure first, then the pulleys, then the idlers, then the loading point, and only then touch the belt. The order matters because every step further down the list is influenced by everything above it, so correcting an idler on a twisted frame simply hides the twist.

The structure check on the Drayton-6 came first. Both stringers were measured for level across the width at every third stand, and a twist of a few millimetres was found across the middle third of the run. That twist had almost certainly been there since installation, which fits the history because the belt has never tracked properly on this machine rather than having gone off recently.

Ops asked whether a twist that small could really move a belt that far. Maintenance explained that a belt behaves like a very long, very compliant shaft and always climbs toward the side that reaches it first, so a small persistent geometric error accumulates over the length of the run into a large steady-state offset. The belt is not wandering; it is obediently following the frame it has been given.

The pulleys were checked next. The head pulley was square within tolerance, the tail pulley was out by a noticeable amount, and its lagging had worn into a shallow taper on one side. A tapered pulley steers the belt continuously, and a crowned pulley that has worn flat steers it in the other direction, which explains why corrections at the tail seemed to work briefly and then reverse.

Idler alignment on the Drayton-6 was measured with a string line rather than by eye. Four carrying idlers sat forward of square, all of them in the section where the frame twist had been found, which is the pattern you would expect from fitters correcting a symptom locally over several years. Two return rollers had also been knocked out during a previous belt change.

The loading point turned out to matter more than anyone had assumed. Material was being delivered off centre by roughly a hand's width, and an off-centre load steers a belt as effectively as any mechanical fault because the loaded side sags and slows. Ops confirmed the chute liner had been replaced with a slightly different profile and never re-aimed afterwards.

At that point the thread reached agreement on a sequence rather than on a single fix. The frame twist would be corrected first with shims at the affected stands, then the tail pulley re-lagged and set square, then the idlers strung true from a fresh reference, then the chute liner re-aimed, and only after all of that would anyone judge the tracking.

Maintenance added one further caution, which is that the belt itself should be inspected for a splice run out of square before any of this is judged a success. A splice cut a degree or two off square produces a periodic wander that repeats once per belt revolution, and it is easy to mistake for a tracking fault right up until somebody times it. The Drayton-6 splice was checked and found square, which ruled that out early.

Ops asked how the result should be recorded so the next crew does not start over. Maintenance suggested marking the belt edge position at four fixed points along the run with the belt empty and again loaded, and writing those figures on the machine sheet as the reference. Without a recorded reference, every future crew judges tracking by memory and reaches a different conclusion.

The work was carried out across a planned outage and the Drayton-6 has run true since, empty and loaded, with the edge positions holding within a few millimetres of the recorded reference. The lesson everyone took from the thread is that the belt was never the problem and that three earlier corrections had each made the underlying geometry harder to see.
"""

