# RAG eval harness — fixture corpus (45 documents)
#
# Read this before editing. The corpus is a measuring instrument, not sample
# data: each document is planted to make one retrieval capability observable
# with a clear relevance margin. Ranking metrics are rank-based, so near-ties
# between a target and a decoy would make baselines jitter for reasons that
# have nothing to do with a retrieval change.
#
# Schema (exact — the loader rejects missing/unknown keys):
#   slug         stable fixture identifier, unique, never a DB id
#   source_type  "note" | "media" | "conversation" (singular; matches the
#                app's ITEM_TYPE_* ingestion contract)
#   title        indexed alongside content by the real writers — treat it as
#                part of the document when reasoning about token overlap
#   content      >= 3 sentences, self-contained, timeless (no wall-clock
#                dates, no randomness, nothing that decays)
#
# Capability groups (marked by the section comments below; the group is NOT a
# parsed field — golden.toml's `category` is the machine-readable side):
#   keyword-exact       a rare literal token the query repeats verbatim
#                       (FTS advantage)
#   paraphrase          target states the fact in vocabulary the query never
#                       uses — ZERO content-word overlap with its query, so
#                       keyword retrieval cannot reach it (vector advantage)
#   vocabulary-mismatch target uses only the domain term ("myocardial
#                       infarction") for the query's common term ("heart
#                       attack"), with no other shared content word either —
#                       unreachable today, the expansion-advantage cases P2
#                       is expected to move (the harness proves they are NOT
#                       retrieved now)
#   distractor          shares the *generic* surface tokens of some query
#                       (torque, limiter, slipping) but never the rare
#                       identifier that resolves it; is nobody's
#                       relevant_slugs entry
#
# Invariants the always-on tests enforce (Tests/RAG_Eval/test_goldenset_integrity.py):
#   - every paraphrase / vocabulary-mismatch query shares no content word
#     (stem-level) with its target's title+content;
#   - every keyword query owns at least one content token that occurs only in
#     its target documents;
#   - every negative query's distinctive terms are absent corpus-wide;
#   - every document has >= 3 sentences.
# Adding a document that mentions another group's query term (e.g. writing
# "heart attack" anywhere) silently destroys the case it was planted for.

