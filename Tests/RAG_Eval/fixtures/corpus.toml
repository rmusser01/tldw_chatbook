[[doc]]
slug = "note-saltmarsh-hide"
source_type = "note"
title = "Estuary bird hide, volunteer wardens' note"
content = """
The timber bird hide sits at the far end of the saltmarsh path, where the creek widens into open mud and the horizon is nothing but water and sky.
Wading birds work that mud on the falling tide, moving out with the water and back again as it returns, and the whole flock lifts at once when a harrier drifts along the far bank.
Godwits probe deep with long bills while the smaller waders take what lies on the surface, so the two feed side by side without contest.
A plant list is kept beside the tally board inside the hide, since the shingle bank carries several uncommon flowering species that draw a different sort of visitor in the warm months.
Sea aster holds the seaward edge, glasswort takes the bare silt below it, and a fringe of sea lavender colours the upper marsh whenever the light comes in low from the west.
Brent geese arrive from the north and graze the eel grass through the cold months, calling continually to one another in a low rolling murmur that carries right across the flats.
The shutters are hung so they can be raised without a sound, because a dropped shutter empties the mud in front of the hide for a quarter of an hour and everybody inside loses the morning.
Volunteers learned that lesson early and now pack the hinges with felt, which also keeps the salt air out of the pivots.
Routine maintenance of the hide falls to the volunteer wardens rather than to any contractor, and a single morning between tides is usually enough for the round.
A barn owl hunts the rough grass behind the sea wall at dusk, quartering the same beat again and again with its wings held in a shallow vee.
In the coldest weeks a merlin sometimes takes a stand on the fence line and scatters the finch flock feeding on the seed heads there.
Ringing on the shingle happens at first light on still mornings, when the mist nets hang slack and the birds cannot see them against the grey.
Each bird is weighed, measured across the wing, aged from its feather wear, and let go within a few minutes of being lifted from the net.
The tally board inside the hide is where visitors add their sightings, and it fills quickly during passage when something scarce turns up on the far scrape.
Children are given the low bench under the small window, which puts them at the right height for the near scrape without a stool.
The two alders behind the hide hold nesting boxes that are cleared of old down and left open to dry once the young have gone.
Bats use the same boxes later in the season, so nobody touches them between the two occupations.
The approach boardwalk greens over quickly in shade and is brushed clear where the planks turn slippery underfoot.
A record of each visit is left in the wardens' cabinet by the gate, so the following party knows what was already done and what was only started.
"""
