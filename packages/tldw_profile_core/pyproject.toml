[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tldw-profile-core"
version = "0.1.0"
description = "Canonical Personal Context Profile contract"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3"]

[tool.setuptools.package-data]
tldw_profile_core = ["schemas/*.json", "fixtures/v1/*.json"]

[tool.setuptools.data-files]
"schemas" = ["schemas/personal-context-v1.json"]
"fixtures/v1" = ["fixtures/v1/valid-preference.json", "fixtures/v1/invalid-record.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
