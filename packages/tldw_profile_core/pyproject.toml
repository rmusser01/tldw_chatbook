[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tldw-profile-core"
version = "0.1.0"
description = "Canonical Personal Context Profile contract"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3"]

[tool.setuptools.package-data]
tldw_profile_core = ["schemas/*.json", "fixtures/v1/*.json"]

[tool.setuptools.data-files]
"schemas" = [
    "schemas/personal-context-v1.json",
    "schemas/personal-context-v1-meta.json",
]
"fixtures/v1" = [
    "fixtures/v1/01-manifest.json",
    "fixtures/v1/02-scope.json",
    "fixtures/v1/03-active-record.json",
    "fixtures/v1/04-deleted-tombstone.json",
    "fixtures/v1/05-proposal.json",
    "fixtures/v1/06-unknown-field-version.json",
    "fixtures/v1/07-working-context-expiry.json",
    "fixtures/v1/08-missing-proposal-base.json",
    "fixtures/v1/09-deleted-with-content.json",
    "fixtures/v1/10-working-context-missing-expiry.json",
    "fixtures/v1/11-kind-payload-mismatch.json",
    "fixtures/v1/12-update-missing-content.json",
    "fixtures/v1/13-create-missing-content.json",
    "fixtures/v1/14-pending-89-day-expiry.json",
    "fixtures/v1/15-proposal-identity-mismatch.json",
    "fixtures/v1/16-proposal-base-mismatch.json",
    "fixtures/v1/17-multibyte-canonical-overflow.json",
    "fixtures/v1/18-pending-deleted-proposed-record.json",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
